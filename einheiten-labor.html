<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Einheiten-Labor</title>
<style>
/* =========================================================
   DESIGN-TOKENS (Light / Dark passend zum System)
   ========================================================= */
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel2:#eef0f6; --text:#18202e; --muted:#5f6b7f;
  --line:#dde1ea; --accent:#3563e9; --accent-soft:#e6ecff;
  --l1:#2f7ae0; --l2:#8a55e6; --l3:#d0800a; --base:#4a5568; --dimless:#0f9d76;
  --ok:#16a34a; --warn:#c2610c; --err:#dc2626;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f131a; --panel:#171c25; --panel2:#1f2632; --text:#e6e9ef; --muted:#97a1b3;
    --line:#2a3240; --accent:#7096ff; --accent-soft:#1f2a47;
    --l1:#5aa0ff; --l2:#a985ff; --l3:#f0a83a; --base:#a0aec0; --dimless:#34d1a4;
    --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%; min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1100px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}

/* ---------- Kopfzeile ---------- */
header{display:flex;align-items:center;gap:10px;padding:14px 0 8px;flex-wrap:wrap}
header h1{font-size:1.2rem;margin:0;letter-spacing:-.01em;flex:1;min-width:150px}
header h1 small{display:block;font-size:.78rem;font-weight:500;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;height:40px;min-width:40px;
  padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);font-size:.9rem}
.iconbtn:active{transform:scale(.96)}
.iconbtn .lbl{display:none}
@media (min-width:640px){.iconbtn .lbl{display:inline}}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.lvlpill{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.lvlpill.on{color:var(--text)}
.lvlpill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--l1),var(--l2),var(--l3));transition:width .5s}

/* ---------- Layout ---------- */
.layout{display:grid;gap:14px}
@media (min-width:900px){
  .layout{grid-template-columns:380px 1fr;align-items:start}
  .bench{position:sticky;top:12px}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- Werkbank ---------- */
.bench{padding:14px;position:sticky;top:0;z-index:5}
@media (max-width:899px){.bench{top:6px}}
.bench h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.slot{min-height:78px;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:6px;background:var(--panel2);transition:border-color .15s,background .15s;position:relative}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.slot.hover{border-color:var(--accent);background:var(--accent-soft)}
.slot .ph{color:var(--muted);font-size:.8rem}
.slot .sym{font-size:1.3rem;font-weight:700}
.slot .nm{font-size:.72rem;color:var(--muted)}
.slot .clr{position:absolute;top:2px;right:4px;border:0;background:none;color:var(--muted);font-size:1rem;padding:2px 6px}
.opsep{font-size:1.2rem;color:var(--muted);width:20px;text-align:center}
.ops{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.op{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:44px;font-weight:700;font-size:1.05rem}
.op.bin{background:var(--accent);color:#fff;border-color:transparent}
.op:disabled{opacity:.35;cursor:default}
.op:not(:disabled):active{transform:scale(.95)}
.msg{margin-top:10px;font-size:.88rem;min-height:2.6em;padding:8px 10px;border-radius:10px;background:var(--panel2);color:var(--muted)}
.msg b{color:var(--text)}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--text)}
.msg.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--text)}
.msg.info{background:color-mix(in srgb,var(--dimless) 14%,transparent);color:var(--text)}
.hint-line{font-size:.75rem;color:var(--muted);margin-top:8px}

/* ---------- Kacheln ---------- */
.tiles{padding:14px}
.tiles h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 8px}
.tiles section + section{margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);border-left:4px solid var(--c,var(--base));background:var(--panel);
  border-radius:12px;padding:8px 6px 7px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;
  transition:transform .12s, box-shadow .12s, border-color .12s}
.tile:hover{box-shadow:var(--shadow)}
.tile .sym{font-weight:700;font-size:1.05rem;line-height:1.2;word-break:break-word}
.tile .nm{font-size:.7rem;color:var(--muted);line-height:1.2;margin-top:2px}
.tile .fm{font-size:.68rem;color:var(--muted);margin-top:2px;opacity:.85}
.tile.k-base{--c:var(--base)}
.tile.k-l1{--c:var(--l1)} .tile.k-l2{--c:var(--l2)} .tile.k-l3{--c:var(--l3)}
.tile.k-inter{border-style:dashed;border-left-style:solid;--c:var(--line)}
.tile.k-dimless{--c:var(--dimless)}
.tile.sel{outline:2px solid var(--accent);outline-offset:1px}
.tile.armed{transform:scale(1.05);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tile.dragging{opacity:.35}
.tile .del{position:absolute;top:0;right:0;border:0;background:none;color:var(--muted);font-size:.9rem;padding:2px 6px;line-height:1}
.tile.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.tile.flash{animation:flash 1s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px var(--accent)}}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;width:96px;opacity:.95;transform-origin:center;
  box-shadow:0 10px 30px rgba(0,0,0,.25)}
.empty{color:var(--muted);font-size:.85rem;padding:6px 2px}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .25s}
.overlay.open .sheet{transform:none}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px;padding:22px}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h2{margin:0;font-size:1.15rem;flex:1}
.close{border:0;background:var(--panel2);border-radius:10px;width:36px;height:36px;font-size:1.1rem}

/* Lernkarte */
.card{border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:14px;margin-bottom:12px}
.card .big{font-size:2.2rem;font-weight:800;line-height:1;color:var(--c)}
.card .title{font-weight:700;font-size:1.05rem}
.card .qty{color:var(--muted);font-size:.85rem}
.card h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.steps{margin:0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.steps li{padding:6px 10px;background:var(--panel2);border-radius:8px;margin-bottom:4px;font-size:.95rem}
.steps li.words{background:none;padding-left:0;font-weight:600}
.steps li .eq{color:var(--muted);margin-right:6px}
.formula{font-family:ui-serif,Georgia,"Times New Roman",serif;font-style:italic;font-size:1.05rem}
.note{margin-top:10px;font-size:.88rem;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--warn) 13%,transparent)}
.badge{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.newhead{text-align:center;margin:0 0 12px}
.newhead .spark{font-size:1.8rem}
.newhead h2{margin:4px 0 0;font-size:1.25rem}

/* Sammelbuch */
.book-level{margin-top:16px}
.book-level h3{font-size:.9rem;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bentry{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:8px 10px;text-align:left;background:var(--panel);min-height:62px}
.bentry .s{font-weight:700}
.bentry .n{font-size:.75rem;color:var(--muted)}
.bentry.unknown{border-left-color:var(--line);background:repeating-linear-gradient(135deg,var(--panel2) 0 6px,transparent 6px 12px);cursor:default}
.bentry.unknown .s{color:var(--muted);letter-spacing:.15em}
.locked{opacity:.55}
.selftest{margin-top:18px;font-size:.78rem;color:var(--muted)}
.selftest.fail{color:var(--err)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:.25s;z-index:120;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Entdeckungs-Funken */
.burst{position:fixed;left:50%;top:40%;width:0;height:0;z-index:110;pointer-events:none}
.burst i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--bc);animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⚗️ Einheiten-Labor<small>Baue SI-Einheiten aus den 7 Basiseinheiten</small></h1>
    <button class="iconbtn" id="btnTip" title="Tipp">💡<span class="lbl">Tipp</span></button>
    <button class="iconbtn" id="btnBook" title="Sammelbuch">📖<span class="lbl" id="bookLbl">0/0</span></button>
    <button class="iconbtn" id="btnSound" title="Ton an/aus" aria-pressed="true">🔊</button>
    <button class="iconbtn" id="btnReset" title="Fortschritt zurücksetzen">↺</button>
  </header>
  <div class="progress" aria-hidden="true"><i id="progBar" style="width:0"></i></div>
  <div class="levels" id="levels" style="margin-top:10px"></div>

  <div class="layout">
    <div class="bench panel" id="bench">
      <h2>Werkbank</h2>
      <div class="slots">
        <div class="slot" id="slotA" data-slot="A"></div>
        <div class="opsep">⋯</div>
        <div class="slot" id="slotB" data-slot="B"></div>
      </div>
      <div class="ops">
        <button class="op bin" data-op="×" title="Multiplizieren">×</button>
        <button class="op bin" data-op="÷" title="Dividieren (links ÷ rechts)">÷</button>
        <button class="op" data-op="²" title="Quadrieren">x²</button>
        <button class="op" data-op="³" title="Kubieren">x³</button>
        <button class="op" data-op="1/x" title="Kehrwert">1/x</button>
      </div>
      <div class="msg" id="msg">Ziehe zwei Kacheln auf die Werkbank – oder tippe sie nacheinander an. Dann wähle eine Operation.</div>
      <div class="hint-line">x², x³ und 1/x wirken auf die linke Kachel. Tippe eine Werkbank-Kachel an, um sie zu entfernen.</div>
    </div>

    <div class="tiles panel" id="tiles"></div>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================================
   1) KATALOG  –  rein datengetrieben, hier neue Einheiten ergänzen
   -------------------------------------------------------------------------
   Exponentenvektor-Reihenfolge: [m, kg, s, A, K, mol, cd]
   recipe: { a, op, b }  ->  a/b sind IDs (Basis- oder Katalog-Einheit),
           'sr' (dimensionslos) oder ein roher Vektor (Zwischengröße).
           op ∈ '×' | '÷' | '²' | '³' | '1/x'
   viaDimless: Einheit hat dieselbe Dimension wie eine Basiseinheit und wird
               nur erkannt, wenn eine dimensionslose Kachel beteiligt ist.
   ========================================================================= */
const BASE_UNITS = [
  { id:'m',   symbol:'m',   name:'Meter',     qty:'Länge',       vec:[1,0,0,0,0,0,0] },
  { id:'kg',  symbol:'kg',  name:'Kilogramm', qty:'Masse',       vec:[0,1,0,0,0,0,0] },
  { id:'s',   symbol:'s',   name:'Sekunde',   qty:'Zeit',        vec:[0,0,1,0,0,0,0] },
  { id:'A',   symbol:'A',   name:'Ampere',    qty:'Stromstärke', vec:[0,0,0,1,0,0,0] },
  { id:'K',   symbol:'K',   name:'Kelvin',    qty:'Temperatur',  vec:[0,0,0,0,1,0,0] },
  { id:'mol', symbol:'mol', name:'Mol',       qty:'Stoffmenge',  vec:[0,0,0,0,0,1,0] },
  { id:'cd',  symbol:'cd',  name:'Candela',   qty:'Lichtstärke', vec:[0,0,0,0,0,0,1] },
];

const LEVELS = [
  { level:1, title:'Stufe 1 · Grundlagen',            unlockNeed:0 },
  { level:2, title:'Stufe 2 · Mechanik & Strom',      unlockNeed:6 }, // 6 Entdeckungen aus Stufe 1
  { level:3, title:'Stufe 3 · Feld, Licht & Wärme',   unlockNeed:6 }, // 6 Entdeckungen aus Stufe 2
];

const CATALOG = [
  // ---------------- Stufe 1 ----------------
  { id:'flaeche', level:1, qty:'Fläche', name:'Quadratmeter', symbol:'m²', vec:[2,0,0,0,0,0,0],
    formula:'A = l · b', recipe:{a:'m', op:'²'},
    info:'Eine Fläche entsteht, wenn man eine Länge mit einer zweiten Länge multipliziert.',
    example:'Ein DIN-A4-Blatt hat etwa 0,06 m².' },
  { id:'volumen', level:1, qty:'Volumen', name:'Kubikmeter', symbol:'m³', vec:[3,0,0,0,0,0,0],
    formula:'V = A · h', recipe:{a:'flaeche', op:'×', b:'m'},
    info:'Volumen ist Fläche mal Höhe – also dreimal eine Länge.',
    example:'Ein Liter sind 0,001 m³.' },
  { id:'geschw', level:1, qty:'Geschwindigkeit', name:'Meter pro Sekunde', symbol:'m/s', vec:[1,0,-1,0,0,0,0],
    formula:'v = s / t', recipe:{a:'m', op:'÷', b:'s'},
    info:'Geschwindigkeit sagt, wie viel Weg pro Zeit zurückgelegt wird.',
    example:'50 km/h sind ungefähr 14 m/s.' },
  { id:'beschl', level:1, qty:'Beschleunigung', name:'Meter pro Sekundenquadrat', symbol:'m/s²', vec:[1,0,-2,0,0,0,0],
    formula:'a = v / t', recipe:{a:'geschw', op:'÷', b:'s'},
    info:'Beschleunigung sagt, wie stark sich die Geschwindigkeit jede Sekunde ändert.',
    example:'Im freien Fall: etwa 9,81 m/s².' },
  { id:'frequenz', level:1, qty:'Frequenz', name:'Hertz', symbol:'Hz', vec:[0,0,-1,0,0,0,0],
    formula:'f = 1 / T', recipe:{a:'s', op:'1/x'},
    info:'Frequenz zählt, wie oft etwas pro Sekunde passiert.',
    example:'Der Kammerton A schwingt 440-mal pro Sekunde: 440 Hz.' },
  { id:'dichte', level:1, qty:'Dichte', name:'Kilogramm pro Kubikmeter', symbol:'kg/m³', vec:[-3,1,0,0,0,0,0],
    formula:'ρ = m / V', recipe:{a:'kg', op:'÷', b:'volumen'},
    info:'Dichte gibt an, wie viel Masse in einem bestimmten Volumen steckt.',
    example:'Wasser: 1000 kg/m³, Luft: etwa 1,2 kg/m³.' },
  { id:'impuls', level:1, qty:'Impuls', name:'Kilogrammmeter pro Sekunde', symbol:'kg·m/s', vec:[1,1,-1,0,0,0,0],
    formula:'p = m · v', recipe:{a:'kg', op:'×', b:'geschw'},
    info:'Der Impuls ist der „Schwung“ eines Körpers: Masse mal Geschwindigkeit.',
    example:'Ein LKW hat bei gleichem Tempo viel mehr Impuls als ein Fahrrad.' },
  { id:'kraft', level:1, qty:'Kraft', name:'Newton', symbol:'N', vec:[1,1,-2,0,0,0,0],
    formula:'F = m · a', recipe:{a:'kg', op:'×', b:'beschl'},
    info:'Kraft ist Masse mal Beschleunigung. Sie bringt Dinge in Bewegung oder verformt sie.',
    example:'Eine 100-g-Tafel Schokolade drückt mit etwa 1 N auf deine Hand.' },
  { id:'ladung', level:1, qty:'Elektrische Ladung', name:'Coulomb', symbol:'C', vec:[0,0,1,1,0,0,0],
    formula:'Q = I · t', recipe:{a:'A', op:'×', b:'s'},
    info:'Ladung ist Stromstärke mal Zeit – also wie viel Elektrizität geflossen ist.',
    example:'Ein Handy-Akku speichert rund 10 000 C.' },
  { id:'molmasse', level:1, qty:'Molare Masse', name:'Kilogramm pro Mol', symbol:'kg/mol', vec:[0,1,0,0,0,-1,0],
    formula:'M = m / n', recipe:{a:'kg', op:'÷', b:'mol'},
    info:'Die molare Masse ist die Masse von einem Mol eines Stoffes.',
    example:'Wasser: 0,018 kg/mol (also 18 g pro Mol).' },
  { id:'konz', level:1, qty:'Stoffmengenkonzentration', name:'Mol pro Kubikmeter', symbol:'mol/m³', vec:[-3,0,0,0,0,1,0],
    formula:'c = n / V', recipe:{a:'mol', op:'÷', b:'volumen'},
    info:'Die Konzentration sagt, wie viel Stoffmenge in einem Volumen gelöst ist.',
    example:'Meerwasser enthält etwa 600 mol/m³ Kochsalz (0,6 mol/L).' },

  // ---------------- Stufe 2 ----------------
  { id:'druck', level:2, qty:'Druck', name:'Pascal', symbol:'Pa', vec:[-1,1,-2,0,0,0,0],
    formula:'p = F / A', recipe:{a:'kraft', op:'÷', b:'flaeche'},
    info:'Druck ist Kraft pro Fläche. Kleine Fläche, gleiche Kraft → großer Druck.',
    example:'Luftdruck auf Meereshöhe: etwa 100 000 Pa = 1 bar.' },
  { id:'energie', level:2, qty:'Energie / Arbeit', name:'Joule', symbol:'J', vec:[2,1,-2,0,0,0,0],
    formula:'W = F · s', recipe:{a:'kraft', op:'×', b:'m'},
    info:'Arbeit ist Kraft mal Weg. Dabei wird Energie übertragen.',
    example:'Einen Apfel (≈ 1 N) einen Meter hochheben kostet etwa 1 J.' },
  { id:'drehmoment', level:2, qty:'Drehmoment', name:'Newtonmeter', symbol:'N·m', vec:[2,1,-2,0,0,0,0],
    formula:'M = F · r', recipe:{a:'kraft', op:'×', b:'m'},
    info:'Drehmoment ist Kraft mal Hebelarm – es bringt etwas zum Drehen.',
    example:'Radmuttern am Auto zieht man mit etwa 110 N·m an.',
    note:'Gleiche Dimension wie Energie (J)! Man schreibt trotzdem N·m, weil Kraft und Hebelarm senkrecht aufeinander stehen – es wird keine Arbeit verrichtet.' },
  { id:'leistung', level:2, qty:'Leistung', name:'Watt', symbol:'W', vec:[2,1,-3,0,0,0,0],
    formula:'P = E / t', recipe:{a:'energie', op:'÷', b:'s'},
    info:'Leistung ist Energie pro Zeit: Wie schnell Energie umgesetzt wird.',
    example:'Eine LED-Lampe braucht etwa 8 W, ein Wasserkocher 2000 W.' },
  { id:'spannung', level:2, qty:'Elektrische Spannung', name:'Volt', symbol:'V', vec:[2,1,-3,-1,0,0,0],
    formula:'U = P / I', recipe:{a:'leistung', op:'÷', b:'A'},
    info:'Spannung ist Leistung pro Stromstärke – der „Antrieb“ für den elektrischen Strom.',
    example:'Eine Steckdose liefert 230 V, eine AA-Batterie 1,5 V.' },
  { id:'widerstand', level:2, qty:'Elektrischer Widerstand', name:'Ohm', symbol:'Ω', vec:[2,1,-3,-2,0,0,0],
    formula:'R = U / I', recipe:{a:'spannung', op:'÷', b:'A'},
    info:'Der Widerstand gibt an, wie stark ein Bauteil den Strom bremst.',
    example:'Ein Wasserkocher hat etwa 25 Ω.' },

/* =========================================================================
   2) KERNLOGIK  –  Vektor-Mathematik, Formatierung, Abgleich (ohne DOM)
   ========================================================================= */
const DIM = 7;
const SYMBOLS = ['m','kg','s','A','K','mol','cd'];
const DISPLAY_ORDER = [1,0,3,2,4,5,6];         // kg·m²/s³ statt m²·kg/s³, A·s statt s·A
const MAX_EXP = 9;                             // Schutz vor absurden Kacheln
const ZERO = [0,0,0,0,0,0,0];
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

const norm   = v => v.map(x => x + 0);           // -0 → 0
const vAdd   = (a,b) => norm(a.map((x,i) => x + b[i]));
const vSub   = (a,b) => norm(a.map((x,i) => x - b[i]));
const vScale = (a,k) => norm(a.map(x => x * k));
const vEq    = (a,b) => a.every((x,i) => x === b[i]);
const vKey   = v => norm(v).join(',');
const isZero = v => v.every(x => x === 0);
const keyVec = k => k.split(',').map(Number);

/** Wendet eine Operation an:  × addiert, ÷ subtrahiert, Potenzen multiplizieren. */
function applyOp(op, a, b){
  switch(op){
    case '×':   return vAdd(a,b);
    case '÷':   return vSub(a,b);
    case '²':   return vScale(a,2);
    case '³':   return vScale(a,3);
    case '1/x': return vScale(a,-1);
  }
  throw new Error('Unbekannte Operation ' + op);
}
const isBinary = op => op === '×' || op === '÷';

/** Vektor → hübsche Einheit, z. B. [2,1,-3,0,0,0,0] → "kg·m²/s³" */
function fmt(v){
  if (isZero(v)) return '1';
  const sup = e => e === 1 ? '' : String(e).split('').map(c => SUP[c]).join('');
  const num = [], den = [];
  for (const i of DISPLAY_ORDER){
    const e = v[i];
    if (e > 0) num.push(SYMBOLS[i] + sup(e));
    else if (e < 0) den.push(SYMBOLS[i] + sup(-e));
  }
  let s = num.length ? num.join('·') : '1';
  if (den.length) s += '/' + (den.length > 1 ? '(' + den.join('·') + ')' : den[0]);
  return s;
}

const BASE_BY_ID = Object.fromEntries(BASE_UNITS.map(b => [b.id, b]));
const CAT_BY_ID  = Object.fromEntries(CATALOG.map(c => [c.id, c]));
const BASE_KEYS  = new Set(BASE_UNITS.map(b => vKey(b.vec)));

/** Rezept-Referenz → Vektor */
function refVec(ref){
  if (Array.isArray(ref)) return ref;
  if (ref === 'sr') return ZERO;
  if (BASE_BY_ID[ref]) return BASE_BY_ID[ref].vec;
  if (CAT_BY_ID[ref])  return CAT_BY_ID[ref].vec;
  throw new Error('Unbekannte Referenz ' + ref);
}
/** Rezept-Referenz → Größenname für Tipps */
function refName(ref){
  if (Array.isArray(ref)) return 'eine Zwischengröße';
  if (ref === 'sr') return 'Raumwinkel';
  if (BASE_BY_ID[ref]) return BASE_BY_ID[ref].qty;
  return CAT_BY_ID[ref].qty;
}
function refSymbol(ref){
  if (Array.isArray(ref)) return fmt(ref);
  if (ref === 'sr') return 'sr';
  return (BASE_BY_ID[ref] || CAT_BY_ID[ref]).symbol;
}

/** Alle Katalogeinträge mit genau dieser Dimension. */
function matchCatalog(vec, dimlessOperand){
  return CATALOG.filter(e => vEq(e.vec, vec) && (!e.viaDimless || dimlessOperand));
}

/** Rechenweg als Liste von Zeilen, z. B. ["kg × m/s²", "kg·m/s²"] */
function routeSteps(op, aVec, bVec, aLab, bLab){
  const wrap = s => /[·\/]/.test(s) ? '(' + s + ')' : s;
  const expr = (x, y) => isBinary(op) ? `${x} ${op} ${y}` : op === '1/x' ? `1/${wrap(x)}` : `${wrap(x)}${op}`;
  const res = applyOp(op, aVec, bVec);
  const steps = [expr(aLab, bLab)];
  const aF = fmt(aVec), bF = bVec ? fmt(bVec) : null;
  if (aF !== aLab || (bVec && bF !== bLab)) steps.push(expr(aF, bF));
  steps.push(fmt(res));
  return steps;
}

/* =========================================================================
   3) SELBSTTEST  –  prüft Katalog & Rechenregeln (läuft bei jedem Start)
   ========================================================================= */
function selfTest(){
  const out = [];
  const t = (name, ok) => out.push({ name, ok: !!ok });
  const V = refVec;
  const mul = (a,b) => applyOp('×', V(a), V(b));
  const div = (a,b) => applyOp('÷', V(a), V(b));

  // Bekannte Identitäten
  t('N = kg·m/s²',  vEq(V('kraft'), mul('kg','beschl')));
  t('J = N·m',      vEq(V('energie'), mul('kraft','m')));
  t('W = J/s',      vEq(V('leistung'), div('energie','s')));
  t('V = W/A',      vEq(V('spannung'), div('leistung','A')));
  t('Ω = V/A',      vEq(V('widerstand'), div('spannung','A')));
  t('S = 1/Ω',      vEq(V('leitwert'), applyOp('1/x', V('widerstand'))));
  t('Pa = N/m²',    vEq(V('druck'), div('kraft','flaeche')));
  t('Hz = 1/s',     vEq(V('frequenz'), applyOp('1/x', V('s'))));
  t('C = A·s',      vEq(V('ladung'), mul('A','s')));
  t('F = C/V',      vEq(V('kapazitaet'), div('ladung','spannung')));
  t('Wb = V·s',     vEq(V('weber'), mul('spannung','s')));
  t('T = Wb/m²',    vEq(V('tesla'), div('weber','flaeche')));
  t('H = Wb/A',     vEq(V('induktivitaet'), div('weber','A')));
  t('H = Ω·s',      vEq(V('induktivitaet'), mul('widerstand','s')));
  t('lx = lm/m²',   vEq(V('lux'), div('lumen','flaeche')));
  t('Drehmoment ≙ Energie', vEq(V('drehmoment'), V('energie')));
  t('m² = m × m',   vEq(V('flaeche'), mul('m','m')));

  // Struktur jedes Eintrags + Rezept ergibt den Vektor
  const ids = new Set();
  for (const e of CATALOG){
    t(`${e.id}: eindeutige ID`, !ids.has(e.id) && !BASE_BY_ID[e.id]); ids.add(e.id);
    t(`${e.id}: Vektor mit 7 ganzen Zahlen`, e.vec.length === DIM && e.vec.every(Number.isInteger));
    t(`${e.id}: Pflichtfelder`, ['name','symbol','qty','formula','info','example'].every(k => typeof e[k] === 'string' && e[k]) && [1,2,3].includes(e.level));
    const r = e.recipe;
    t(`${e.id}: Rezept stimmt`, vEq(applyOp(r.op, refVec(r.a), r.b !== undefined ? refVec(r.b) : undefined), e.vec));
    const lvlOk = [r.a, r.b].filter(x => x !== undefined && !Array.isArray(x) && CAT_BY_ID[x]).every(x => CAT_BY_ID[x].level <= e.level);
    t(`${e.id}: Zutaten aus erreichbarer Stufe`, lvlOk);
    t(`${e.id}: keine Basiseinheit (außer via dimensionslos)`, e.viaDimless || !BASE_KEYS.has(vKey(e.vec)));
  }
  // Kommutativität a×b = b×a, und a÷b = a×(1/b), für alle Paare
  const all = [...BASE_UNITS, ...CATALOG].map(x => x.vec);
  let comm = true, divInv = true;
  for (const a of all) for (const b of all){
    if (!vEq(applyOp('×',a,b), applyOp('×',b,a))) comm = false;
    if (!vEq(applyOp('÷',a,b), applyOp('×',a,applyOp('1/x',b)))) divInv = false;
  }
  t('Kommutativität a×b = b×a (alle Paare)', comm);
  t('a÷b = a×(1/b) (alle Paare)', divInv);
  // Formatierung: keine Roh-Exponenten
  t('Format kg·m²/s³', fmt([2,1,-3,0,0,0,0]) === 'kg·m²/s³');
  t('Format 1/s', fmt([0,0,-1,0,0,0,0]) === '1/s');
  t('Format J/(kg·K)', fmt(V('spezwaerme')) === 'm²/(s²·K)');
  t('Format ohne Minus/^', [...BASE_UNITS, ...CATALOG].every(x => !/[-^]/.test(fmt(x.vec))));
  return out;
}

/* =========================================================================
   4) SPIELZUSTAND & SPEICHERN
   ========================================================================= */
const STORE_KEY = 'einheiten-labor-v1';
const DIMLESS_KEY = vKey(ZERO);
function freshState(){
  return { discovered: [], tiles: BASE_UNITS.map(b => vKey(b.vec)), sound: true, hints: 0 };
}
let state = freshState();
function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.tiles)) return;
    state = Object.assign(freshState(), s);
    state.discovered = state.discovered.filter(id => CAT_BY_ID[id]);
    for (const k of BASE_KEYS) if (!state.tiles.includes(k)) state.tiles.unshift(k);
    state.tiles = [...new Set(state.tiles)];
  } catch(e) { /* Speicher nicht verfügbar – Spiel läuft trotzdem */ }
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}

const isDiscovered = id => state.discovered.includes(id);
function countLevel(l){ return CATALOG.filter(e => e.level === l && isDiscovered(e.id)).length; }
/** Höchste freigeschaltete Stufe */
function unlockedLevel(){
  let lvl = 1;
  for (let i = 1; i < LEVELS.length; i++){
    if (countLevel(i) >= LEVELS[i].unlockNeed) lvl = i + 1; else break;
  }
  return lvl;
}

/** Beschreibung einer Kachel aus ihrem Schlüssel */
function tileInfo(key){
  const vec = keyVec(key);
  const base = BASE_UNITS.find(b => vKey(b.vec) === key);
  const named = CATALOG.filter(e => vKey(e.vec) === key && isDiscovered(e.id));
  if (base){
    return { key, vec, kind:'base', sym:base.symbol, name:base.name, sub: named.length ? 'auch: ' + named.map(n => n.symbol).join(', ') : base.qty, label:base.symbol, qtyName:base.qty };
  }
  if (key === DIMLESS_KEY){
    return { key, vec, kind:'dimless', sym:'1', name:'dimensionslos', sub:'z. B. rad, sr', label:'sr', qtyName:'Raumwinkel (dimensionslos)', deletable:true };
  }
  if (named.length){
    const syms = [...new Set(named.map(n => n.symbol))];
    const lvl = Math.min(...named.map(n => n.level));
    return { key, vec, kind:'l'+lvl, sym:syms.join(' / '), name:named.map(n => n.qty).join(' / '),
      sub: syms[0] !== fmt(vec) ? fmt(vec) : '', label:syms[0], qtyName:named[0].qty, named };
  }
  return { key, vec, kind:'inter', sym:fmt(vec), name:'Zwischenergebnis', sub:'', label:fmt(vec), qtyName:'Zwischengröße', deletable:true };
}

        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, st);
        g.gain.exponentialRampToValueAtTime(vol, st + .01);
        g.gain.exponentialRampToValueAtTime(.0001, st + dur);
        o.connect(g).connect(actx.destination);
        o.start(st); o.stop(st + dur + .03);
      });
    } catch(e) {}
  }
  const sfx = {
    tap:      () => tone([660], .05, 'sine', 0, .05),

        const i = tileInfo(k);
        el.className = 'slot filled';
        el.innerHTML = `<span class="sym">${i.sym}</span><span class="nm">${i.name}</span><button class="clr" aria-label="entfernen">×</button>`;
      }
    }
    const one = slots.A !== null || slots.B !== null, two = slots.A !== null && slots.B !== null;
    document.querySelectorAll('.op').forEach(b => b.disabled = isBinary(b.dataset.op) ? !two : !one);
    document.querySelectorAll('.tile').forEach(t => t.classList.toggle('sel', t.dataset.key === slots.A || t.dataset.key === slots.B));
  }
  function renderHeader(){
    const total = CATALOG.length, n = state.discovered.length;
    $('#bookLbl').textContent = `${n}/${total}`;
    $('#btnBook').title = `Sammelbuch: ${n}/${total} entdeckt`;
    $('#progBar').style.width = (n / total * 100) + '%';
    const ul = unlockedLevel();
    $('#levels').innerHTML = LEVELS.map((L, i) => {
      const lv = L.level, have = countLevel(lv), all = CATALOG.filter(e => e.level === lv).length;
      if (lv <= ul) return `<span class="lvlpill on"><span class="dot" style="background:${lvlColor(lv)}"></span>Stufe ${lv}: ${have}/${all}</span>`;
      const need = L.unlockNeed - countLevel(lv - 1);
      return `<span class="lvlpill">🔒 Stufe ${lv} – noch ${need} aus Stufe ${lv - 1}</span>`;
    }).join('');
    $('#btnSound').textContent = state.sound ? '🔊' : '🔇';
    $('#btnSound').setAttribute('aria-pressed', String(state.sound));
  }
  function renderAll(){ renderTiles(); renderSlots(); renderHeader(); }

  /* ---------- Werkbank ---------- */
  function placeTile(key, slot){
    if (slot) slots[slot] = key;
    else if (slots.A === null) slots.A = key;
    else if (slots.B === null) slots.B = key;
    else slots.B = key;
    sfx.tap(); renderSlots();
  }
  function clearSlots(){ slots.A = slots.B = null; renderSlots(); }

  function combine(op){
    let aKey, bKey = null;
    if (isBinary(op)){
      if (slots.A === null || slots.B === null) return;
      aKey = slots.A; bKey = slots.B;
    } else {
      aKey = slots.A !== null ? slots.A : slots.B;
      if (aKey === null) return;
    }
    const A = tileInfo(aKey), B = bKey ? tileInfo(bKey) : null;
    const res = applyOp(op, A.vec, B ? B.vec : undefined);
    const key = vKey(res);

    if (res.some(e => Math.abs(e) > MAX_EXP)){
      sfx.error(); msg('Das wird zu exotisch – Exponenten über 9 kommen in der Praxis nicht vor.', 'warn'); return;
    }
    const steps = routeSteps(op, A.vec, B && B.vec, A.label, B && B.label);
    const stepTxt = steps.join(' = ');
    const ul = unlockedLevel();
    const dimlessOperand = isZero(A.vec) || (B && isZero(B.vec));
    const existed = state.tiles.includes(key);
    clearSlots();

    // Dimensionslos: eigener Hinweis
    if (isZero(res)){
      if (!existed){ state.tiles.push(key); newKey = key; }
      sfx.combine(); save(); renderAll();
      msg(`<b>${stepTxt}</b> – dimensionslos! Alle Einheiten kürzen sich weg.`, 'info');
      openDimless(stepTxt, existed);
      return;
    }

    const matches = matchCatalog(res, dimlessOperand);
    const fresh  = matches.filter(e => e.level <= ul && !isDiscovered(e.id));
    const locked = matches.filter(e => e.level > ul && !isDiscovered(e.id));
    if (!existed){ state.tiles.push(key); newKey = key; }

    if (fresh.length){
      fresh.forEach(e => state.discovered.push(e.id));
      save(); renderAll();
      const ul2 = unlockedLevel();
      sfx.discover(); burst(lvlColor(fresh[0].level));
      msg(`✨ <b>Neue Einheit entdeckt:</b> ${fresh.map(e => `${e.qty} (${e.symbol})`).join(' und ')}`, 'ok');
      openLearnCard(fresh, { op, A, B, steps }, true);
      if (ul2 > ul) setTimeout(() => { toast(`🔓 ${LEVELS[ul2 - 1].title} freigeschaltet!`); tone([392,523,659,784,1047],.2,'sine',.08,.08); }, 900);
      return;
    }
    save(); renderAll();
    if (locked.length){
      sfx.exists();
      msg(`<b>${stepTxt}</b><br>🔒 Das sieht nach einer Einheit aus <b>Stufe ${locked[0].level}</b> aus. Schalte die Stufe frei und baue sie dann noch einmal!`, 'warn');
    } else if (existed){
      sfx.exists(); flashTile(key);
      const i = tileInfo(key);
      msg(`<b>${stepTxt}</b> – diese Kachel hast du schon${i.kind !== 'inter' ? `: <b>${i.name}</b>` : ''}.`);
    } else {
      sfx.combine();
      msg(`<b>${stepTxt}</b><br>Keine benannte Einheit – aber eine neue Zwischenkachel zum Weiterbauen.`);
    }
  }
  function flashTile(key){
    const el = tilesEl.querySelector(`.tile[data-key="${key}"]`);
    if (!el) return;
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    el.scrollIntoView({ block:'nearest', behavior:'smooth' });
  }

  /* ---------- Lernkarte ---------- */
  function cardHTML(e, route){
    // route: { words, steps }  – Rechenweg Schritt für Schritt
    const same = CATALOG.filter(o => o.id !== e.id && vEq(o.vec, e.vec));
    const steps = [...route.steps];
    if (steps[steps.length - 1] !== e.symbol) steps.push(e.symbol + ' (' + e.name + ')');
    return `<div class="card" style="--c:${lvlColor(e.level)}">
      <div style="display:flex;gap:14px;align-items:center">
        <div class="big">${e.symbol}</div>
        <div><div class="title">${e.qty}</div><div class="qty">${e.name} · <span class="badge">Stufe ${e.level}</span></div></div>
      </div>
      <h4>Rechenweg</h4>
      <ul class="steps">
        <li class="words">${route.words}</li>
        ${steps.map((s, i) => `<li>${i ? '<span class="eq">=</span>' : ''}${s}</li>`).join('')}
      </ul>
      <h4>Formel</h4><div class="formula">${e.formula}</div>
      <h4>Was bedeutet das?</h4><div>${e.info}</div>
      <h4>Im Alltag</h4><div>${e.example}</div>
      ${e.note ? `<div class="note">⚠️ ${e.note}</div>` : ''}
      ${same.length ? `<div class="note" style="background:var(--panel2)">🔗 Gleiche Dimension wie: ${same.map(o => isDiscovered(o.id) ? `<b>${o.qty} (${o.symbol})</b>` : '<i>eine noch unentdeckte Größe</i>').join(', ')}</div>` : ''}
    </div>`;
  }
  function wordsFor(op, aName, bName, target){
    if (isBinary(op)) return `${target} = ${aName} ${op} ${bName}`;
    if (op === '1/x') return `${target} = 1 / ${aName}`;
    return `${target} = ${aName}${op}`;
  }
  function openLearnCard(entries, ctx, isNew){
    const body = entries.map(e => cardHTML(e, {
      words: wordsFor(ctx.op, ctx.A.qtyName, ctx.B && ctx.B.qtyName, e.qty),
      steps: ctx.steps,
    })).join('');
    openSheet(isNew
      ? `<div class="newhead"><div class="spark">✨</div><h2>Neue Einheit entdeckt!</h2></div>${body}
         <button class="op bin" style="width:100%" data-close>Weiter forschen</button>`
      : body, isNew ? '' : entries[0].qty);
  }
  function openBookEntry(id){
    const e = CAT_BY_ID[id], r = e.recipe;
    const bV = r.b !== undefined ? refVec(r.b) : undefined;
    openLearnCard([e], {
      op: r.op, A: { qtyName: refName(r.a) }, B: r.b !== undefined ? { qtyName: refName(r.b) } : null,
      steps: routeSteps(r.op, refVec(r.a), bV, refSymbol(r.a), r.b !== undefined ? refSymbol(r.b) : null),
    }, false);
  }
  function openDimless(stepTxt, existed){
    openSheet(`<div class="card" style="--c:var(--dimless)">
      <div style="display:flex;gap:14px;align-items:center"><div class="big">1</div>
      <div><div class="title">Dimensionslose Größe</div><div class="qty">Kein Eintrag im Sammelbuch</div></div></div>
      <h4>Rechenweg</h4><ul class="steps"><li>${stepTxt}</li></ul>
      <h4>Was bedeutet das?</h4>
      <div>Wenn oben und unten dieselben Einheiten stehen, kürzen sie sich weg. Übrig bleibt eine reine Zahl.</div>
      <h4>Beispiele</h4>
      <div>Winkel im Bogenmaß: rad = m/m · Raumwinkel: sr = m²/m² · Wirkungsgrad: W/W</div>
      <div class="note" style="background:var(--panel2)">💡 ${existed ? 'Die' : 'Neu: die'} Kachel „1“ steht für den Raumwinkel (sr). Probier sie mit einer Basiseinheit für Licht aus …</div>
    </div><button class="op bin" style="width:100%" data-close>Verstanden</button>`, 'Dimensionslos!');
  }

  /* ---------- Sammelbuch ---------- */
  function openBook(){
    const ul = unlockedLevel(), n = state.discovered.length;
    const pass = TEST.length - testFails.length;
    let html = `<div style="margin-bottom:6px"><b>${n}/${CATALOG.length}</b> entdeckt</div>
      <div class="progress"><i style="width:${n / CATALOG.length * 100}%"></i></div>`;
    for (const L of LEVELS){
      const lock = L.level > ul, entries = CATALOG.filter(e => e.level === L.level);
      html += `<div class="book-level ${lock ? 'locked' : ''}"><h3><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${lvlColor(L.level)}"></span>
        ${L.title} <span class="badge">${countLevel(L.level)}/${entries.length}</span>${lock ? ' 🔒' : ''}</h3>
        <div class="book-grid">${entries.map(e => isDiscovered(e.id)
          ? `<button class="bentry" style="--c:${lvlColor(e.level)}" data-entry="${e.id}"><div class="s">${e.symbol}</div><div class="n">${e.qty}</div></button>`
          : `<div class="bentry unknown"><div class="s">???</div><div class="n">${lock ? 'gesperrt' : 'unentdeckt'}</div></div>`).join('')}
        </div></div>`;
    }
    html += `<div class="selftest ${testFails.length ? 'fail' : ''}">Selbsttest des Katalogs: ${pass}/${TEST.length} Prüfungen bestanden${testFails.length ? ' – Fehler: ' + testFails.map(f => f.name).join(', ') : ' ✓'}</div>`;
    openSheet(html, '📖 Sammelbuch');
  }

  /* ---------- Tipp ---------- */
  function giveTip(){
    const ul = unlockedLevel();
    const open = CATALOG.filter(e => e.level <= ul && !isDiscovered(e.id));
    if (!open.length){
      msg(ul < LEVELS.length ? 'Alles in deinen Stufen entdeckt!' : '🏆 Du hast alle Einheiten entdeckt – großartig!', 'ok'); return;
    }
    const has = ref => state.tiles.includes(vKey(refVec(ref)));
    const ready = open.filter(e => has(e.recipe.a) && (e.recipe.b === undefined || has(e.recipe.b)));
    const half  = open.filter(e => has(e.recipe.a));
    const pool  = ready.length ? ready : half.length ? half : open;
    const minL  = Math.min(...pool.map(e => e.level));
    const cands = pool.filter(e => e.level === minL);
    const e = cands[state.hints++ % cands.length];
    save();
    const r = e.recipe;
    let text;
    if (isBinary(r.op)) text = `<b>${e.qty}</b> = ${refName(r.a)} ${r.op} ?`;
    else text = `<b>${e.qty}</b>: Probier es mit <b>${refName(r.a)}</b> allein – welche Operation (x², x³, 1/x) passt?`;
    if (!ready.includes(e)) text += `<br><small>Der zweite Baustein fehlt dir noch – baue ihn zuerst.</small>`;
    msg('💡 ' + text, 'info'); sfx.tap();
  }

  /* ---------- Modal ---------- */
  let lastFocus = null;
  function openSheet(inner, title){
    lastFocus = document.activeElement;
    sheet.innerHTML = (title ? `<div class="sheet-head"><h2>${title}</h2><button class="close" data-close aria-label="Schließen">✕</button></div>` : '') + inner;
    overlay.classList.add('open');
    sheet.scrollTop = 0;
    const f = sheet.querySelector('[data-close]'); if (f) f.focus({ preventScroll:true });
  }
  function closeSheet(){ overlay.classList.remove('open'); if (lastFocus) lastFocus.focus?.({ preventScroll:true }); }
  overlay.addEventListener('click', ev => {
    if (ev.target === overlay || ev.target.closest('[data-close]')) return closeSheet();
    const b = ev.target.closest('[data-entry]'); if (b) openBookEntry(b.dataset.entry);
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && overlay.classList.contains('open')) closeSheet(); });

  /* ---------- Drag & Drop (Pointer Events) + Tippen ---------- */
  // Maus/Stift: Ziehen startet sofort. Touch: kurz halten (≈ 0,2 s), dann ziehen –
  // so bleibt normales Scrollen der Kachelliste möglich. Kurzes Antippen = auswählen.
  let drag = null;
  const slotAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('[data-slot], #bench'); };

  tilesEl.addEventListener('pointerdown', ev => {
    const t = ev.target.closest('.tile');
    if (!t || ev.target.closest('[data-del]') || (ev.button !== undefined && ev.button > 0)) return;
    drag = { key: t.dataset.key, el: t, x0: ev.clientX, y0: ev.clientY, id: ev.pointerId,
             touch: ev.pointerType === 'touch', armed: ev.pointerType !== 'touch', started: false, ghost: null };
    if (drag.touch) drag.timer = setTimeout(() => {
      if (!drag || drag.started) return;
      drag.armed = true; t.classList.add('armed'); navigator.vibrate?.(10);
    }, 200);
  });
  window.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const d = Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0);
    if (!drag.started){
      if (!drag.armed){ if (d > 10) endDrag(); return; }   // Touch bewegt sich vor dem Halten → Scrollen
      if (d < 5) return;
      drag.started = true;
      drag.ghost = drag.el.cloneNode(true);
      drag.ghost.classList.add('ghost'); drag.ghost.classList.remove('armed','sel','pop','flash');
      document.body.appendChild(drag.ghost);
      drag.el.classList.add('dragging');
    }
    drag.ghost.style.transform = `translate(${ev.clientX - 48}px, ${ev.clientY - 37}px) scale(1.05)`;
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));
    const target = slotAt(ev.clientX, ev.clientY);
    if (target && target.dataset.slot) target.classList.add('hover');
  });
  window.addEventListener('pointerup', ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const d = Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0);
    if (drag.started){
      const target = slotAt(ev.clientX, ev.clientY);
      if (target) placeTile(drag.key, target.dataset.slot || null);
    } else if (d < 10){
      placeTile(drag.key, null);           // Antippen: in freien Slot legen
    }
    endDrag();
  });
  window.addEventListener('pointercancel', () => endDrag());
  // Verhindert Scrollen, sobald ein Touch-Drag „scharf“ ist
  document.addEventListener('touchmove', ev => { if (drag && (drag.armed && drag.touch)) ev.preventDefault(); }, { passive:false });
  tilesEl.addEventListener('contextmenu', ev => { if (ev.target.closest('.tile')) ev.preventDefault(); });
  function endDrag(){
    if (!drag) return;
    clearTimeout(drag.timer);
    drag.el.classList.remove('armed','dragging');
    drag.ghost?.remove();
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));
    drag = null;
  }
  // Tastatur: Enter/Leertaste auf einer Kachel
  tilesEl.addEventListener('keydown', ev => {
    const t = ev.target.closest('.tile');
    if (t && (ev.key === 'Enter' || ev.key === ' ')){ ev.preventDefault(); placeTile(t.dataset.key, null); }
  });
  // Zwischenkachel löschen
  tilesEl.addEventListener('click', ev => {
    const del = ev.target.closest('[data-del]'); if (!del) return;
    const key = del.closest('.tile').dataset.key;
    state.tiles = state.tiles.filter(k => k !== key);
    if (slots.A === key) slots.A = null;
    if (slots.B === key) slots.B = null;
    save(); renderAll();
  });
  // Slots leeren
  Object.entries(slotEls).forEach(([s, el]) => el.addEventListener('click', () => {
    if (slots[s] !== null){ slots[s] = null; renderSlots(); }
  }));

  /* ---------- Buttons ---------- */
  document.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => combine(b.dataset.op)));
  $('#btnTip').addEventListener('click', giveTip);
  $('#btnBook').addEventListener('click', openBook);
  $('#btnSound').addEventListener('click', () => { state.sound = !state.sound; save(); renderHeader(); sfx.tap(); });
  $('#btnReset').addEventListener('click', () => {
    if (!confirm('Fortschritt wirklich zurücksetzen? Alle Entdeckungen gehen verloren.')) return;
    const snd = state.sound; state = freshState(); state.sound = snd;
    slots.A = slots.B = null; save(); renderAll();
    msg('Neustart! Beginne mit den 7 Basiseinheiten.');
  });

  renderAll();
})();
</script>
