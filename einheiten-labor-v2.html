<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Einheiten-Labor</title>
<style>
/* =========================================================
   DESIGN – Schwarz/Weiß, ruhig, im Stil von Notion
   ========================================================= */
:root{
  --bg:#ffffff; --soft:#f7f7f5; --hover:rgba(55,53,47,.06); --line:rgba(55,53,47,.16);
  --text:#37352f; --muted:rgba(55,53,47,.65); --faint:rgba(55,53,47,.42);
  --strong:#191919; --inv:#ffffff;
  --radius:8px;
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191919; --soft:#202020; --hover:rgba(255,255,255,.055); --line:rgba(255,255,255,.13);
    --text:rgba(255,255,255,.87); --muted:rgba(255,255,255,.58); --faint:rgba(255,255,255,.38);
    --strong:#ffffff; --inv:#191919;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.55 var(--font);-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand tools" "tabs tabs";gap:6px 12px;
  padding:10px 16px 8px;padding-top:max(10px,env(safe-area-inset-top))}
@media (min-width:720px){.top{grid-template-columns:1fr auto 1fr;grid-template-areas:"brand tabs tools";align-items:center}}
.brand{grid-area:brand;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .logo{width:22px;height:22px;border-radius:5px;background:var(--strong);color:var(--inv);display:grid;place-items:center;font-size:.72rem;font-weight:800}
.tools{grid-area:tools;display:flex;gap:2px;justify-content:flex-end}
.tabs{grid-area:tabs;display:flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.tabs button{flex:1;padding:6px 14px;border-radius:6px;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;color:var(--muted);font-size:.9rem}
.ghost:hover{background:var(--hover);color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);font-size:.92rem;background:var(--bg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--strong);color:var(--inv);border-color:var(--strong);font-weight:600}
.btn.primary:hover{opacity:.88}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- Spalte ---------- */
.col{max-width:720px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
h1.page{font-size:1.9rem;line-height:1.2;margin:8px 0 4px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 20px}
.label{font-size:.75rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}

/* ---------- Aufgabenleiste ---------- */
.taskbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.taskbar .goal{flex:1;min-width:200px}
.taskbar .goal .t{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.taskbar .goal .s{font-size:.85rem;color:var(--muted)}
.meter{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--strong);transition:width .5s}

/* ---------- Werkbank ---------- */
.bench{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg)}
@media (min-height:700px){.bench{position:sticky;top:96px;z-index:10}}
@media (min-height:700px) and (min-width:720px){.bench{top:64px}}
.slots{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:6px}
.slot{min-height:86px;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:8px;background:var(--soft);transition:border-color .15s,background .15s;position:relative;cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--strong);background:var(--bg)}
.slot.hover{border-color:var(--strong);background:var(--hover)}
.slot .ph{color:var(--faint);font-size:.85rem}
.slot .sym{font-size:1.5rem;font-weight:700;line-height:1.15}
.slot .nm{font-size:.75rem;color:var(--muted)}
.slot .clr{position:absolute;top:4px;right:6px;color:var(--faint);font-size:.95rem}
.opmark{text-align:center;color:var(--faint);font-size:1.3rem}
.ops{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.op{height:44px;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:1.05rem;background:var(--bg)}
.op:hover:not(:disabled){background:var(--hover)}
.op.bin{background:var(--strong);color:var(--inv);border-color:var(--strong)}
.op:disabled{opacity:.3;cursor:default}
.op:not(:disabled):active{transform:scale(.96)}
.result{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:14px;align-items:center;min-height:64px}
.result .rtext{flex:1;font-size:.92rem;color:var(--muted)}
.result .rtext b{color:var(--text)}
.result .rtext .eq{font-size:1rem;color:var(--text);font-weight:600;margin-bottom:2px}
.result.win{animation:win .6s ease}
@keyframes win{0%{box-shadow:none}40%{box-shadow:0 0 0 3px var(--strong)}100%{box-shadow:none}}

/* ---------- Bausteine (Bruch-Darstellung) ---------- */
.bricks{display:inline-flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.brow{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:220px}
.bbar{height:1.5px;background:var(--text);align-self:stretch;min-width:34px}
.brick{border:1.5px solid var(--text);border-radius:5px;padding:0 6px;font-size:.78rem;font-weight:600;min-width:26px;text-align:center;line-height:1.6;background:var(--bg)}
.brick.x{opacity:.35;text-decoration:line-through}
.brick.one{border-style:dashed}
.bricks.lg .brick{font-size:.95rem;padding:2px 9px}

/* ---------- Bausteinkasten (Kacheln) ---------- */
.drawer{margin-top:18px}
.drawer section + section{margin-top:16px}
.drawer h3{margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:baseline;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:background .12s,transform .12s,box-shadow .12s;cursor:grab}
.chip:hover{background:var(--hover)}
.chip .sym{font-weight:650}
.chip .nm{font-size:.76rem;color:var(--muted)}
.chip.k-base{border-color:var(--strong)}
.chip.k-named{background:var(--soft)}
.chip.k-inter{border-style:dashed}
.chip.k-dimless{border-style:dotted;border-width:2px}
.chip.sel{box-shadow:0 0 0 2px var(--strong)}
.chip.armed{transform:scale(1.06);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.chip.dragging{opacity:.3}
.chip .del{margin-left:2px;color:var(--faint);font-size:.9rem;line-height:1;padding:0 2px}
.chip.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.chip.flash{animation:flash 1s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--strong)}}
.dragghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;box-shadow:0 10px 28px rgba(0,0,0,.25);cursor:grabbing}
.empty{color:var(--faint);font-size:.88rem}
.helpline{font-size:.8rem;color:var(--faint);margin-top:10px}

/* ---------- Listen (Abenteuer / Lernen) ---------- */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line);width:100%;text-align:left;border-radius:0}
.row:hover:not(:disabled){background:var(--hover)}
.row:disabled{opacity:.4;cursor:default}
.row .num{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600;flex:none}
.row.done .num{background:var(--strong);color:var(--inv);border-color:var(--strong)}
.row .main{flex:1;min-width:0}
.row .main .t{font-weight:600}
.row .main .s{font-size:.82rem;color:var(--muted)}
.stars{letter-spacing:2px;font-size:.95rem;white-space:nowrap}
.chapter{margin:26px 0 6px}

/* ---------- Lektion lesen ---------- */
.lesson{font-size:1.05rem}
.lesson p{margin:0 0 14px}
.lesson .demo{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:18px;background:var(--soft);border-radius:10px;margin:6px 0 16px}
.lesson .demo .opbig{font-size:1.4rem;color:var(--muted)}
.lesson table{border-collapse:collapse;width:100%;margin:4px 0 16px;font-size:.95rem}
.lesson td,.lesson th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
.lesson th{font-size:.75rem;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.callout{display:flex;gap:10px;background:var(--soft);border-radius:8px;padding:12px 14px;margin:0 0 14px;font-size:.95rem}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--strong)}
.navrow{display:flex;justify-content:space-between;gap:10px}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .22s;box-shadow:0 -1px 0 var(--line)}
.overlay.open .sheet{transform:none}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:14px;padding:26px}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:1.2rem;flex:1}
.card{padding:4px 0 6px}
.card + .card{border-top:1px solid var(--line);padding-top:16px;margin-top:10px}
.card .head{display:flex;gap:16px;align-items:center}
.card .big{font-size:2.4rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.card .title{font-weight:700;font-size:1.1rem}
.card .sub{color:var(--muted);font-size:.88rem}
.card h4{margin:16px 0 6px}
.steps{list-style:none;margin:0;padding:0}
.steps li{padding:5px 10px;background:var(--soft);border-radius:6px;margin-bottom:3px;font-variant-numeric:tabular-nums}
.steps li.words{background:none;padding-left:0;font-weight:600}
.steps .eq{color:var(--faint);margin-right:6px}
.formula{font-family:var(--serif);font-style:italic;font-size:1.1rem}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.celebrate{text-align:center;margin-bottom:14px}
.celebrate .bigstars{font-size:2.2rem;letter-spacing:6px}
.celebrate h2{margin:4px 0 2px;font-size:1.4rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btnrow .btn{flex:1}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.bentry{border:1px solid var(--line);border-radius:7px;padding:8px 10px;text-align:left;min-height:56px}
.bentry:hover{background:var(--hover)}
.bentry .s{font-weight:700}
.bentry .n{font-size:.75rem;color:var(--muted)}
.bentry.unknown{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px);cursor:default}
.bentry.unknown .s{color:var(--faint);letter-spacing:.15em}
.locked{opacity:.5}
.foot{margin-top:18px;font-size:.78rem;color:var(--faint)}

/* Toast & Funken */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--strong);color:var(--inv);
  padding:9px 16px;border-radius:8px;font-size:.9rem;opacity:0;transition:.22s;z-index:120;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.burst{position:fixed;width:0;height:0;z-index:110;pointer-events:none}
.burst i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--strong);animation:fly .8s ease-out forwards}
.burst i:nth-child(2n){background:transparent;border:1.5px solid var(--strong)}
@keyframes fly{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">SI</span>Einheiten-Labor</div>
  <nav class="tabs" id="tabs">
    <button data-mode="learn">Lernen</button>
    <button data-mode="adventure">Abenteuer</button>
    <button data-mode="labor">Labor</button>
  </nav>
  <div class="tools">
    <button class="ghost" id="btnSound" title="Ton an/aus"></button>
    <button class="ghost" id="btnReset" title="Alles zurücksetzen"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  </div>
</header>

<main class="col">
  <section id="panel"></section>
  <section id="taskbar" class="taskbar"></section>
  <section id="bench" class="bench">
    <div class="slots">
      <div class="slot" id="slotA" data-slot="A"></div>
      <div class="opmark" id="opmark">·</div>
      <div class="slot" id="slotB" data-slot="B"></div>
    </div>
    <div class="ops">
      <button class="op bin" data-op="×" title="Multiplizieren">×</button>
      <button class="op bin" data-op="÷" title="Dividieren (links ÷ rechts)">÷</button>
      <button class="op" data-op="²" title="Quadrieren">x²</button>
      <button class="op" data-op="³" title="Kubieren">x³</button>
      <button class="op" data-op="1/x" title="Kehrwert">1/x</button>
    </div>
    <div class="result" id="result"></div>
  </section>
  <section id="drawer" class="drawer"></section>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================================
   1) DATEN  –  Katalog, Abenteuer-Level, Lektionen (alles leicht erweiterbar)
   -------------------------------------------------------------------------
   Exponentenvektor-Reihenfolge: [m, kg, s, A, K, mol, cd]
   Referenzen in Rezepten/Lösungen: ID einer Basis-/Katalogeinheit, 'sr'
   (dimensionslos), ein roher Vektor oder '#n' (= Ergebnis von Schritt n).
   ========================================================================= */
const BASE_UNITS = [
  { id:'m',   symbol:'m',   name:'Meter',     qty:'Länge',       vec:[1,0,0,0,0,0,0] },
  { id:'kg',  symbol:'kg',  name:'Kilogramm', qty:'Masse',       vec:[0,1,0,0,0,0,0] },
  { id:'s',   symbol:'s',   name:'Sekunde',   qty:'Zeit',        vec:[0,0,1,0,0,0,0] },
  { id:'A',   symbol:'A',   name:'Ampere',    qty:'Stromstärke', vec:[0,0,0,1,0,0,0] },
  { id:'K',   symbol:'K',   name:'Kelvin',    qty:'Temperatur',  vec:[0,0,0,0,1,0,0] },
  { id:'mol', symbol:'mol', name:'Mol',       qty:'Stoffmenge',  vec:[0,0,0,0,0,1,0] },
  { id:'cd',  symbol:'cd',  name:'Candela',   qty:'Lichtstärke', vec:[0,0,0,0,0,0,1] },
];

/* Stufen im freien Labor */
const STAGES = [
  { level:1, title:'Stufe 1 · Grundlagen',          unlockNeed:0 },
  { level:2, title:'Stufe 2 · Mechanik & Strom',    unlockNeed:6 },
  { level:3, title:'Stufe 3 · Feld, Licht & Wärme', unlockNeed:6 },
];

const CATALOG = [
  // ---------------- Stufe 1 ----------------
  { id:'flaeche', level:1, qty:'Fläche', name:'Quadratmeter', symbol:'m²', vec:[2,0,0,0,0,0,0],
    formula:'A = l · b', recipe:{a:'m', op:'²'},
    info:'Eine Fläche entsteht, wenn man eine Länge mit einer zweiten Länge multipliziert.',
    example:'Ein DIN-A4-Blatt hat etwa 0,06 m².' },
  { id:'volumen', level:1, qty:'Volumen', name:'Kubikmeter', symbol:'m³', vec:[3,0,0,0,0,0,0],
    formula:'V = A · h', recipe:{a:'flaeche', op:'×', b:'m'},
    info:'Volumen ist Fläche mal Höhe – also dreimal eine Länge.',
    example:'Ein Liter sind 0,001 m³.' },
  { id:'geschw', level:1, qty:'Geschwindigkeit', name:'Meter pro Sekunde', symbol:'m/s', vec:[1,0,-1,0,0,0,0],
    formula:'v = s / t', recipe:{a:'m', op:'÷', b:'s'},
    info:'Geschwindigkeit sagt, wie viel Weg pro Zeit zurückgelegt wird.',
    example:'50 km/h sind ungefähr 14 m/s.' },
  { id:'beschl', level:1, qty:'Beschleunigung', name:'Meter pro Sekundenquadrat', symbol:'m/s²', vec:[1,0,-2,0,0,0,0],
    formula:'a = v / t', recipe:{a:'geschw', op:'÷', b:'s'},
    info:'Beschleunigung sagt, wie stark sich die Geschwindigkeit jede Sekunde ändert.',
    example:'Im freien Fall: etwa 9,81 m/s².' },
  { id:'frequenz', level:1, qty:'Frequenz', name:'Hertz', symbol:'Hz', vec:[0,0,-1,0,0,0,0],
    formula:'f = 1 / T', recipe:{a:'s', op:'1/x'},
    info:'Frequenz zählt, wie oft etwas pro Sekunde passiert.',
    example:'Der Kammerton A schwingt 440-mal pro Sekunde: 440 Hz.' },
  { id:'dichte', level:1, qty:'Dichte', name:'Kilogramm pro Kubikmeter', symbol:'kg/m³', vec:[-3,1,0,0,0,0,0],
    formula:'ρ = m / V', recipe:{a:'kg', op:'÷', b:'volumen'},
    info:'Dichte gibt an, wie viel Masse in einem bestimmten Volumen steckt.',
    example:'Wasser: 1000 kg/m³, Luft: etwa 1,2 kg/m³.' },
  { id:'impuls', level:1, qty:'Impuls', name:'Kilogrammmeter pro Sekunde', symbol:'kg·m/s', vec:[1,1,-1,0,0,0,0],
    formula:'p = m · v', recipe:{a:'kg', op:'×', b:'geschw'},
    info:'Der Impuls ist der „Schwung“ eines Körpers: Masse mal Geschwindigkeit.',
    example:'Ein LKW hat bei gleichem Tempo viel mehr Impuls als ein Fahrrad.' },
  { id:'kraft', level:1, qty:'Kraft', name:'Newton', symbol:'N', vec:[1,1,-2,0,0,0,0],
    formula:'F = m · a', recipe:{a:'kg', op:'×', b:'beschl'},
    info:'Kraft ist Masse mal Beschleunigung. Sie bringt Dinge in Bewegung oder verformt sie.',
    example:'Eine 100-g-Tafel Schokolade drückt mit etwa 1 N auf deine Hand.' },
  { id:'ladung', level:1, qty:'Elektrische Ladung', name:'Coulomb', symbol:'C', vec:[0,0,1,1,0,0,0],
    formula:'Q = I · t', recipe:{a:'A', op:'×', b:'s'},
    info:'Ladung ist Stromstärke mal Zeit – also wie viel Elektrizität geflossen ist.',
    example:'Ein Handy-Akku speichert rund 10 000 C.' },
  { id:'molmasse', level:1, qty:'Molare Masse', name:'Kilogramm pro Mol', symbol:'kg/mol', vec:[0,1,0,0,0,-1,0],
    formula:'M = m / n', recipe:{a:'kg', op:'÷', b:'mol'},
    info:'Die molare Masse ist die Masse von einem Mol eines Stoffes.',
    example:'Wasser: 0,018 kg/mol (also 18 g pro Mol).' },
  { id:'konz', level:1, qty:'Stoffmengenkonzentration', name:'Mol pro Kubikmeter', symbol:'mol/m³', vec:[-3,0,0,0,0,1,0],
    formula:'c = n / V', recipe:{a:'mol', op:'÷', b:'volumen'},
    info:'Die Konzentration sagt, wie viel Stoffmenge in einem Volumen gelöst ist.',
    example:'Meerwasser enthält etwa 600 mol/m³ Kochsalz (0,6 mol/L).' },

  // ---------------- Stufe 2 ----------------
  { id:'druck', level:2, qty:'Druck', name:'Pascal', symbol:'Pa', vec:[-1,1,-2,0,0,0,0],
    formula:'p = F / A', recipe:{a:'kraft', op:'÷', b:'flaeche'},
    info:'Druck ist Kraft pro Fläche. Kleine Fläche, gleiche Kraft → großer Druck.',
    example:'Luftdruck auf Meereshöhe: etwa 100 000 Pa = 1 bar.' },
  { id:'energie', level:2, qty:'Energie / Arbeit', name:'Joule', symbol:'J', vec:[2,1,-2,0,0,0,0],

        <p>🎉 Geschafft! Du kennst jetzt alle Bauregeln. Weiter geht's im <b>Abenteuer</b> – oder entdecke im <b>Labor</b> frei alle ${CATALOG.length} Einheiten.</p>`,

/* =========================================================================
   2) KERNLOGIK  –  Vektor-Mathematik, Formatierung, Abgleich (ohne DOM)
   ========================================================================= */
const DIM = 7;
const SYMBOLS = ['m','kg','s','A','K','mol','cd'];
const DISPLAY_ORDER = [1,0,3,2,4,5,6];          // kg·m²/s³, A·s
const MAX_EXP = 9;
const ZERO = [0,0,0,0,0,0,0];
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

const norm   = v => v.map(x => x + 0);
const vAdd   = (a,b) => norm(a.map((x,i) => x + b[i]));
const vSub   = (a,b) => norm(a.map((x,i) => x - b[i]));
const vScale = (a,k) => norm(a.map(x => x * k));
const vEq    = (a,b) => a.every((x,i) => x === b[i]);
const vKey   = v => norm(v).join(',');
const isZero = v => v.every(x => x === 0);
const keyVec = k => k.split(',').map(Number);
const isBinary = op => op === '×' || op === '÷';

/** × addiert Exponenten, ÷ subtrahiert, Potenz/Kehrwert multipliziert. */
function applyOp(op, a, b){
  switch(op){
    case '×':   return vAdd(a,b);
    case '÷':   return vSub(a,b);
    case '²':   return vScale(a,2);
    case '³':   return vScale(a,3);
    case '1/x': return vScale(a,-1);
  }
  throw new Error('Unbekannte Operation ' + op);
}

/** Vektor → hübsche Einheit, z. B. "kg·m²/s³" (keine Roh-Exponenten). */
function fmt(v){
  if (isZero(v)) return '1';
  const sup = e => e === 1 ? '' : String(e).split('').map(c => SUP[c]).join('');
  const num = [], den = [];
  for (const i of DISPLAY_ORDER){
    const e = v[i];
    if (e > 0) num.push(SYMBOLS[i] + sup(e));
    else if (e < 0) den.push(SYMBOLS[i] + sup(-e));
  }
  let s = num.length ? num.join('·') : '1';
  if (den.length) s += '/' + (den.length > 1 ? '(' + den.join('·') + ')' : den[0]);
  return s;
}

/** Bausteine als Bruch: Zähler-Steine, Bruchstrich, Nenner-Steine. */
function bricksHTML(v, large){
  const row = sign => {
    const out = [];
    for (const i of DISPLAY_ORDER){
      const e = v[i] * sign;
      if (e <= 0) continue;
      if (e > 5) out.push(`<span class="brick">${SYMBOLS[i]} ×${e}</span>`);
      else for (let k = 0; k < e; k++) out.push(`<span class="brick">${SYMBOLS[i]}</span>`);
    }
    return out;
  };
  const top = row(1), bot = row(-1);
  return `<div class="bricks${large ? ' lg' : ''}"><div class="brow">${top.length ? top.join('') : '<span class="brick one">1</span>'}</div>${
    bot.length ? `<div class="bbar"></div><div class="brow">${bot.join('')}</div>` : ''}</div>`;
}

const BASE_BY_ID  = Object.fromEntries(BASE_UNITS.map(b => [b.id, b]));
const BASE_BY_KEY = Object.fromEntries(BASE_UNITS.map(b => [vKey(b.vec), b]));
const CAT_BY_ID   = Object.fromEntries(CATALOG.map(c => [c.id, c]));
const BASE_KEYS   = new Set(Object.keys(BASE_BY_KEY));

function refVec(ref){
  if (Array.isArray(ref)) return ref;
  if (ref === 'sr') return ZERO;
  if (BASE_BY_ID[ref]) return BASE_BY_ID[ref].vec;
  if (CAT_BY_ID[ref])  return CAT_BY_ID[ref].vec;
  throw new Error('Unbekannte Referenz ' + ref);
}
function refName(ref){
  if (Array.isArray(ref)) return 'eine Zwischengröße';
  if (ref === 'sr') return 'Raumwinkel';
  return (BASE_BY_ID[ref] || CAT_BY_ID[ref]).qty;
}
function refSymbol(ref){
  if (Array.isArray(ref)) return fmt(ref);
  if (ref === 'sr') return 'sr';
  return (BASE_BY_ID[ref] || CAT_BY_ID[ref]).symbol;
}
function matchCatalog(vec, dimlessOperand){
  return CATALOG.filter(e => vEq(e.vec, vec) && (!e.viaDimless || dimlessOperand));
}
/** Rechenweg-Zeilen, z. B. ["N ÷ m²", "kg·m/s² ÷ m²", "kg/(m·s²)"] */
function routeSteps(op, aVec, bVec, aLab, bLab){
  const wrap = s => /[·\/]/.test(s) ? '(' + s + ')' : s;
  const expr = (x, y) => isBinary(op) ? `${x} ${op} ${y}` : op === '1/x' ? `1/${wrap(x)}` : `${wrap(x)}${op}`;
  const res = applyOp(op, aVec, bVec);
  const steps = [expr(aLab, bLab)];
  const aF = fmt(aVec), bF = bVec ? fmt(bVec) : null;
  if (aF !== aLab || (bVec && bF !== bLab)) steps.push(expr(aF, bF));
  steps.push(fmt(res));
  return steps;
}
/** Führt eine Lösung (Liste von Schritten) aus. Gibt Ergebnisvektoren zurück oder wirft. */
function runSolution(given, solution){
  const have = new Set(given.map(g => vKey(refVec(g))));
  const results = [];
  const get = r => {
    const v = (typeof r === 'string' && r[0] === '#') ? results[+r.slice(1)] : refVec(r);
    if (!v || !have.has(vKey(v))) throw new Error('Baustein nicht verfügbar: ' + r);
    return v;
  };
  for (const [a, op, b] of solution){
    const res = applyOp(op, get(a), b !== undefined ? get(b) : undefined);
    results.push(res); have.add(vKey(res));
  }
  return results;
}
/** Abenteuer-Level flach mit Nummer und Par */
const ADV_LEVELS = [];
ADVENTURE.forEach(ch => ch.levels.forEach(l => ADV_LEVELS.push(Object.assign({ chapter: ch.chapter, no: ADV_LEVELS.length + 1, par: l.solution.length }, l))));

/* =========================================================================
   3) SELBSTTEST  –  Katalog, Rechenregeln, Level & Lektionen
   ========================================================================= */
function selfTest(){
  const out = [];
  const t = (name, ok) => out.push({ name, ok: !!ok });
  const V = refVec;
  const mul = (a,b) => applyOp('×', V(a), V(b));
  const div = (a,b) => applyOp('÷', V(a), V(b));
  t('N = kg·m/s²',  vEq(V('kraft'), mul('kg','beschl')));
  t('J = N·m',      vEq(V('energie'), mul('kraft','m')));
  t('W = J/s',      vEq(V('leistung'), div('energie','s')));
  t('V = W/A',      vEq(V('spannung'), div('leistung','A')));
  t('Ω = V/A',      vEq(V('widerstand'), div('spannung','A')));
  t('S = 1/Ω',      vEq(V('leitwert'), applyOp('1/x', V('widerstand'))));
  t('Pa = N/m²',    vEq(V('druck'), div('kraft','flaeche')));
  t('Hz = 1/s',     vEq(V('frequenz'), applyOp('1/x', V('s'))));
  t('C = A·s',      vEq(V('ladung'), mul('A','s')));
  t('F = C/V',      vEq(V('kapazitaet'), div('ladung','spannung')));
  t('Wb = V·s',     vEq(V('weber'), mul('spannung','s')));
  t('T = Wb/m²',    vEq(V('tesla'), div('weber','flaeche')));
  t('H = Wb/A',     vEq(V('induktivitaet'), div('weber','A')));
  t('H = Ω·s',      vEq(V('induktivitaet'), mul('widerstand','s')));
  t('lx = lm/m²',   vEq(V('lux'), div('lumen','flaeche')));
  t('Drehmoment ≙ Energie', vEq(V('drehmoment'), V('energie')));

  const ids = new Set();
  for (const e of CATALOG){
    t(`${e.id}: eindeutige ID`, !ids.has(e.id) && !BASE_BY_ID[e.id]); ids.add(e.id);
    t(`${e.id}: Vektor 7 ganze Zahlen`, e.vec.length === DIM && e.vec.every(Number.isInteger));
    t(`${e.id}: Pflichtfelder`, ['name','symbol','qty','formula','info','example'].every(k => typeof e[k] === 'string' && e[k]) && [1,2,3].includes(e.level));
    const r = e.recipe;
    t(`${e.id}: Rezept stimmt`, vEq(applyOp(r.op, refVec(r.a), r.b !== undefined ? refVec(r.b) : undefined), e.vec));
    t(`${e.id}: Zutaten aus erreichbarer Stufe`, [r.a, r.b].filter(x => typeof x === 'string' && CAT_BY_ID[x]).every(x => CAT_BY_ID[x].level <= e.level));
    t(`${e.id}: keine Basiseinheit`, e.viaDimless || !BASE_KEYS.has(vKey(e.vec)));
  }
  const all = [...BASE_UNITS, ...CATALOG].map(x => x.vec);
  let comm = true, divInv = true;
  for (const a of all) for (const b of all){
    if (!vEq(applyOp('×',a,b), applyOp('×',b,a))) comm = false;
    if (!vEq(applyOp('÷',a,b), applyOp('×',a,applyOp('1/x',b)))) divInv = false;
  }
  t('Kommutativität a×b = b×a (alle Paare)', comm);
  t('a÷b = a×(1/b) (alle Paare)', divInv);
  t('Format kg·m²/s³', fmt([2,1,-3,0,0,0,0]) === 'kg·m²/s³');
  t('Format A·s', fmt(V('ladung')) === 'A·s');
  t('Format 1/s', fmt([0,0,-1,0,0,0,0]) === '1/s');
  t('Format ohne Minus/^', all.every(v => !/[-^]/.test(fmt(v))));

  // Abenteuer: Musterlösung erreicht das Ziel, Ziel ist nicht schon gegeben
  ADV_LEVELS.forEach(l => {
    let ok = false;
    try {
      const r = runSolution(l.given, l.solution), last = r[r.length - 1], e = CAT_BY_ID[l.target];
      ok = vEq(last, e.vec) && !l.given.some(g => vKey(refVec(g)) === vKey(e.vec) && !e.viaDimless);
      if (e.viaDimless) ok = ok && l.solution[l.solution.length - 1].some(x => typeof x === 'string' && x[0] === '#' && isZero(r[+x.slice(1)]));
      if (l.maxMoves) ok = ok && l.maxMoves >= l.par;
    } catch(err) { ok = false; }
    t(`Abenteuer ${l.no} (${l.target}) lösbar in ${l.par} Schritten`, ok);
  });
  // Lektionen: Übungen sind lösbar
  LESSONS.forEach((L, i) => {
    if (!L.task) return;
    let ok = false;
    try { const r = runSolution(L.task.given, L.task.solution); ok = vEq(r[r.length - 1], refVec(L.task.target)); } catch(e) {}
    t(`Lektion ${i + 1}: Übung lösbar`, ok);
  });
  return out;
}

/* =========================================================================
   4) SPIELSTAND
   ========================================================================= */
const STORE_KEY = 'einheiten-labor-v2';
const DIMLESS_KEY = vKey(ZERO);
function freshState(){
  return { mode: null, sound: true,
    labor: { discovered: [], tiles: BASE_UNITS.map(b => vKey(b.vec)), hints: 0 },
    adv:   { stars: {} },
    learn: { done: [] } };
}
let state = freshState();
function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      state = Object.assign(freshState(), s);
      state.labor = Object.assign(freshState().labor, s.labor);
      state.adv = Object.assign({ stars:{} }, s.adv);
      state.learn = Object.assign({ done:[] }, s.learn);
    } else {
      // Fortschritt aus Version 1 übernehmen
      const old = JSON.parse(localStorage.getItem('einheiten-labor-v1') || 'null');
      if (old && Array.isArray(old.tiles)){
        state.labor.discovered = old.discovered || [];
        state.labor.tiles = old.tiles; state.sound = old.sound !== false;
      }
    }
    state.labor.discovered = state.labor.discovered.filter(id => CAT_BY_ID[id]);
    for (const k of BASE_KEYS) if (!state.labor.tiles.includes(k)) state.labor.tiles.unshift(k);
    state.labor.tiles = [...new Set(state.labor.tiles)];
  } catch(e) { /* Speicher nicht verfügbar – Spiel läuft trotzdem */ }
}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {} }

const isDiscovered = id => state.labor.discovered.includes(id);
const countStage = l => CATALOG.filter(e => e.level === l && isDiscovered(e.id)).length;
function unlockedStage(){
  let lvl = 1;
  for (let i = 1; i < STAGES.length; i++){ if (countStage(i) >= STAGES[i].unlockNeed) lvl = i + 1; else break; }
  return lvl;
}
function starsFor(moves, par, hinted){
  const s = moves <= par ? 3 : moves <= par + 2 ? 2 : 1;
  return hinted ? Math.min(s, 2) : s;
}
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);

      drawer.innerHTML =
        block('Basiseinheiten', infos.filter(i => i.kind === 'base'), '') +
        block('Entdeckt', infos.filter(i => i.kind === 'named'), 'Noch nichts entdeckt – probiere z. B. m ÷ s.') +
        block('Zwischenergebnisse', infos.filter(i => i.kind === 'inter' || i.kind === 'dimless'), 'Kombinationen ohne Namen landen hier.') +
        `<div class="helpline">Antippen legt eine Kachel auf die Werkbank. Ziehen geht auch (am Handy kurz halten).</div>`;
    } else {
      drawer.innerHTML = block('Deine Bausteine', infos, '') +
        `<div class="helpline">Antippen legt eine Kachel auf die Werkbank. Ziehen geht auch (am Handy kurz halten).</div>`;
    }
    newKey = null;
  }

  function renderSlots(){
    for (const s of ['A','B']){
      const el = slotEls[s], k = slots[s];
      if (k === null){ el.className = 'slot'; el.innerHTML = `<span class="ph">${s === 'A' ? 'Baustein 1' : 'Baustein 2'}</span>`; continue; }
      const i = tileInfo(k);
      el.className = 'slot filled';
      el.innerHTML = `<span class="sym">${i.sym}</span><span class="nm">${i.name || 'Zwischenergebnis'}</span><span class="clr">×</span>`;
    }
    const one = slots.A !== null || slots.B !== null, two = slots.A !== null && slots.B !== null;
    document.querySelectorAll('.op').forEach(b => b.disabled = isBinary(b.dataset.op) ? !two : !one);
    drawer.querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', c.dataset.key === slots.A || c.dataset.key === slots.B));
  }

  function renderResult(){
    if (!result){
      resultEl.className = 'result';
      resultEl.innerHTML = `<div class="rtext">${mode === 'labor'
        ? 'Lege zwei Bausteine auf die Werkbank und wähle eine Rechnung. Gibt es die neue Einheit wirklich, hast du sie entdeckt!'
        : 'Lege Bausteine auf die Werkbank und wähle eine Rechnung.'}</div>`;
      return;
    }
    resultEl.className = 'result' + (result.win ? ' win' : '');
    resultEl.innerHTML = `${result.vec ? bricksHTML(result.vec) : ''}<div class="rtext">
      ${result.eq ? `<div class="eq">${result.eq}</div>` : ''}${result.text || ''}</div>`;
  }
  function setResult(r){ result = r; renderResult(); }

  /* ---------- Listen: Abenteuer & Lernen ---------- */
  function advUnlocked(no){ return no === 1 || (state.adv.stars[no - 1] || 0) > 0; }
  function renderAdventureList(){
    const total = Object.values(state.adv.stars).reduce((a, b) => a + b, 0);
    let html = `<h1 class="page">Abenteuer</h1>
      <p class="lead">In jedem Level sollst du eine bestimmte Einheit bauen – mit möglichst wenigen Schritten. Die Level werden immer schwerer. <b>${total} / ${ADV_LEVELS.length * 3} ★</b></p>`;
    for (const ch of ADVENTURE){
      html += `<h3 class="label chapter">${ch.chapter}</h3><div class="list">`;
      for (const l of ADV_LEVELS.filter(x => x.chapter === ch.chapter)){
        const e = CAT_BY_ID[l.target], st = state.adv.stars[l.no] || 0, open = advUnlocked(l.no);
        html += `<button class="row ${st ? 'done' : ''}" data-level="${l.no}" ${open ? '' : 'disabled'}>
          <span class="num">${l.no}</span>
          <span class="main"><span class="t">${open ? `${e.qty} (${e.symbol})` : 'Gesperrt'}</span>
            <span class="s" style="display:block">${open ? 'Bausteine: ' + l.given.map(refSymbol).join(', ') + (l.maxMoves ? ` · max. ${l.maxMoves} Schritte` : '') : 'Schaffe zuerst das vorige Level'}</span></span>
          <span class="stars">${open ? starStr(st) : ''}</span></button>`;
      }
      html += `</div>`;
    }
    panel.innerHTML = html;
  }
  function renderLessonList(){
    const done = state.learn.done.length;
    panel.innerHTML = `<h1 class="page">Lernen</h1>
      <p class="lead">Ohne Vorwissen: Hier lernst du Schritt für Schritt, wie physikalische Einheiten aus wenigen Grundbausteinen zusammengesetzt sind. ${done}/${LESSONS.length} Lektionen erledigt.</p>
      <div class="list">${LESSONS.map((L, i) => `<button class="row ${state.learn.done.includes(i) ? 'done' : ''}" data-lesson="${i}">
        <span class="num">${state.learn.done.includes(i) ? '✓' : i + 1}</span>
        <span class="main"><span class="t">${L.title}</span><span class="s" style="display:block">${L.sub}${L.task ? ' · mit Übung' : ''}</span></span>
        <span class="s" style="color:var(--faint)">›</span></button>`).join('')}</div>`;
  }
  function renderLessonPage(){
    const L = LESSONS[lessonIdx], last = pageIdx === L.pages.length - 1;
    panel.innerHTML = `<button class="ghost" data-act="learn-list">${ICON.back}Alle Lektionen</button>
      <div class="label" style="margin-top:14px">Lektion ${lessonIdx + 1} von ${LESSONS.length}</div>
      <h1 class="page">${L.title}</h1><p class="lead">${L.sub}</p>
      <div class="lesson">${L.pages[pageIdx](bricksHTML)}</div>
      <div class="dots">${L.pages.map((_, i) => `<i class="${i === pageIdx ? 'on' : ''}"></i>`).join('')}</div>
      <div class="navrow">
        <button class="btn" data-act="page-prev" ${pageIdx === 0 ? 'disabled' : ''}>Zurück</button>
        <button class="btn primary" data-act="page-next">${last ? (L.task ? 'Übung starten' : 'Lektion abschließen') : 'Weiter'}</button>
      </div>`;
  }

  /* ======================================================================
     MODI & AUFGABEN
     ====================================================================== */
  function setMode(m){
    mode = m; state.mode = m; save();
    view = 'list'; task = null; slots.A = slots.B = null; result = null;
    window.scrollTo(0, 0); render();
  }
  function startTask(kind, def){
    const entry = CAT_BY_ID[def.target];
    task = { kind, def, entry, tiles: [...new Set(def.given.map(g => vKey(refVec(g))))], moves: 0, hintStep: 0, hinted: false, done: false };
    view = 'play'; slots.A = slots.B = null; result = null;
    window.scrollTo(0, 0); render();
  }
  const startLevel = no => startTask('adventure', ADV_LEVELS[no - 1]);
  function openLesson(i){ lessonIdx = i; pageIdx = 0; view = 'read'; window.scrollTo(0, 0); render(); }
  function finishLesson(i){
    if (!state.learn.done.includes(i)) state.learn.done.push(i);
    save();
  }

  /* ======================================================================
     WERKBANK
     ====================================================================== */
  function placeTile(key, slot){
    if (slot) slots[slot] = key;
    else if (slots.A === null) slots.A = key;
    else if (slots.B === null) slots.B = key;
    else slots.B = key;
    sfx.tap(); renderSlots();
  }

  function combine(op){
    let aKey, bKey = null;
    if (isBinary(op)){ if (slots.A === null || slots.B === null) return; aKey = slots.A; bKey = slots.B; }
    else { aKey = slots.A !== null ? slots.A : slots.B; if (aKey === null) return; }
    if (task && task.done) return;
    const A = tileInfo(aKey), B = bKey ? tileInfo(bKey) : null;
    const res = applyOp(op, A.vec, B ? B.vec : undefined);
    if (res.some(e => Math.abs(e) > MAX_EXP)){ sfx.error(); setResult({ text:'Das wird zu exotisch – so hohe Hochzahlen kommen in der Praxis nicht vor.' }); return; }
    const steps = routeSteps(op, A.vec, B && B.vec, A.label, B && B.label);
    const ctx = { op, A, B, res, key: vKey(res), steps, eq: steps.join(' = '),
                  dimlessOperand: isZero(A.vec) || (B && isZero(B.vec)) };
    ctx.existed = currentTiles().includes(ctx.key);
    if (!ctx.existed){ currentTiles().push(ctx.key); newKey = ctx.key; }
    slots.A = slots.B = null;
    $('#opmark').textContent = op === '1/x' ? '1/x' : isBinary(op) ? op : 'x' + op;
    setTimeout(() => $('#opmark').textContent = '·', 900);
    mode === 'labor' ? laborResult(ctx) : taskResult(ctx);
  }

  /* ---------- Labor: Entdecken ---------- */
  function laborResult(c){
    const ul = unlockedStage();
    if (isZero(c.res)){
      save(); render();
      sfx.combine();
      setResult({ vec: c.res, eq: c.eq, text: '<b>Dimensionslos!</b> Alle Bausteine haben sich weggekürzt. Die Kachel „1“ steht für den Raumwinkel (sr) – probier sie mit einer Licht-Einheit.' });
      return;
    }
    const matches = matchCatalog(c.res, c.dimlessOperand);
    const fresh = matches.filter(e => e.level <= ul && !isDiscovered(e.id));
    const locked = matches.filter(e => e.level > ul && !isDiscovered(e.id));
    if (fresh.length){
      fresh.forEach(e => state.labor.discovered.push(e.id));
      save(); render();
      sfx.win(); burst();
      setResult({ vec: c.res, eq: c.eq + ' = ' + fresh[0].symbol, win: true, text: `Neu entdeckt: <b>${fresh.map(e => e.qty).join(' und ')}</b>` });
      openCards(fresh, c, 'Neue Einheit entdeckt!');
      const ul2 = unlockedStage();
      if (ul2 > ul) setTimeout(() => { toast(`${STAGES[ul2 - 1].title} freigeschaltet`); tone([392,523,659,784],.2,'sine',.08,.07); }, 900);
      return;
    }
    save(); render();
    if (locked.length){ sfx.exists(); setResult({ vec: c.res, eq: c.eq, text: `Das sieht nach einer Einheit aus <b>Stufe ${locked[0].level}</b> aus. Schalte die Stufe frei und baue sie dann noch einmal.` }); }
    else if (c.existed){ sfx.exists(); flashTile(c.key); const i = tileInfo(c.key);
      setResult({ vec: c.res, eq: c.eq, text: 'Diesen Baustein hast du schon' + (i.kind === 'named' || i.kind === 'base' ? `: <b>${i.name}</b>.` : '.') }); }
    else { sfx.combine(); setResult({ vec: c.res, eq: c.eq, text: 'Keine benannte Einheit – aber ein neuer Zwischenbaustein zum Weiterbauen.' }); }
  }

  /* ---------- Abenteuer & Lernen: Ziel erreicht? ---------- */
  function taskResult(c){
    task.moves++;
    const e = task.entry;
    const success = vEq(c.res, e.vec) && (!e.viaDimless || c.dimlessOperand);
    render();
    if (success){
      task.done = true;
      sfx.win(); burst();
      setResult({ vec: c.res, eq: c.eq + ' = ' + e.symbol, win: true, text: `<b>Geschafft!</b> Das ist ${e.qty}.` });
      // Gilt auch als Entdeckung im Labor
      if (!isDiscovered(e.id)){ state.labor.discovered.push(e.id); if (!state.labor.tiles.includes(c.key)) state.labor.tiles.push(c.key); }
      if (task.kind === 'adventure'){
        const no = task.def.no, st = starsFor(task.moves, task.def.par, task.hinted);
        state.adv.stars[no] = Math.max(state.adv.stars[no] || 0, st);
        save();
        setTimeout(() => openAdventureWin(c, st), 450);
      } else {
        finishLesson(lessonIdx); save();
        setTimeout(() => openLessonWin(c), 450);
      }
      return;
    }
    const named = tileInfo(c.key);
    let text = isZero(c.res) ? '<b>Dimensionslos</b> – alles hat sich weggekürzt.'
      : c.existed ? 'Diesen Baustein hast du schon.'
      : named.kind === 'named' ? `Das ist <b>${named.name}</b> – nicht ganz das Ziel, aber vielleicht ein guter Zwischenschritt.`
      : 'Neuer Zwischenbaustein. Weiter so!';
    if (c.existed) flashTile(c.key);
    sfx.combine();
    setResult({ vec: c.res, eq: c.eq, text });
    if (task.kind === 'adventure' && task.def.maxMoves && task.moves >= task.def.maxMoves){
      task.done = true; sfx.error();
      setTimeout(() => openSheet(`<div class="celebrate"><div class="bigstars">☆☆☆</div><h2>Keine Schritte mehr</h2>
        <p class="lead" style="margin:4px 0 0">Du hattest ${task.def.maxMoves} Schritte. Versuch es noch einmal – der Tipp hilft dir beim Start.</p></div>
        <div class="btnrow"><button class="btn primary" data-act="retry">Nochmal</button><button class="btn" data-act="list">Zur Übersicht</button></div>`), 500);
    }
  }

  function flashTile(key){
    const el = drawer.querySelector(`.chip[data-key="${key}"]`);
    if (!el) return;
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }

  /* ---------- Tipps ---------- */
  function laborTip(){
    const ul = unlockedStage();
    const open = CATALOG.filter(e => e.level <= ul && !isDiscovered(e.id));
    if (!open.length){ setResult({ text: ul < STAGES.length ? 'Alles in deinen Stufen entdeckt!' : 'Du hast alle Einheiten entdeckt – großartig!' }); return; }
    const has = ref => state.labor.tiles.includes(vKey(refVec(ref)));
    const ready = open.filter(e => has(e.recipe.a) && (e.recipe.b === undefined || has(e.recipe.b)));
    const half = open.filter(e => has(e.recipe.a));
    const pool = ready.length ? ready : half.length ? half : open;
    const minL = Math.min(...pool.map(e => e.level));
    const cands = pool.filter(e => e.level === minL);
    const e = cands[state.labor.hints++ % cands.length]; save();
    const r = e.recipe;
    let text = isBinary(r.op) ? `<b>${e.qty}</b> = ${refName(r.a)} ${r.op} ?`
      : `<b>${e.qty}</b>: Probier es mit <b>${refName(r.a)}</b> allein – welche Rechnung (x², x³, 1/x) passt?`;
    if (!ready.includes(e)) text += '<br>Der zweite Baustein fehlt dir noch – baue ihn zuerst.';
    sfx.tap(); setResult({ text: 'Tipp: ' + text });
  }
  function adventureTip(){
    const sol = task.def.solution, i = Math.min(task.hintStep, sol.length - 1);
    const name = r => (typeof r === 'string' && r[0] === '#') ? `dem Ergebnis aus Schritt ${+r.slice(1) + 1}` : `<b>${refSymbol(r)}</b>`;
    const [a, op, b] = sol[i];
    const text = isBinary(op) ? `Schritt ${i + 1}: Rechne ${name(a)} ${op} ${name(b)}.`
      : `Schritt ${i + 1}: Nimm ${name(a)} und drücke <b>${op === '1/x' ? '1/x' : 'x' + op}</b>.`;
    task.hintStep++; task.hinted = true; sfx.tap();
    setResult({ text: 'Tipp (max. ★★): ' + text + (i < sol.length - 1 ? ' Drück nochmal Tipp für den nächsten Schritt.' : '') });
  }

  /* ======================================================================
     KARTEN & DIALOGE
     ====================================================================== */
  function cardHTML(e, words, steps){
    const same = CATALOG.filter(o => o.id !== e.id && vEq(o.vec, e.vec));
    const s = [...steps];
    if (s[s.length - 1] !== e.symbol) s.push(e.symbol + ' (' + e.name + ')');
    return `<div class="card">
      <div class="head"><div class="big">${e.symbol}</div>
        <div><div class="title">${e.qty}</div><div class="sub">${e.name} · <span class="badge">Stufe ${e.level}</span></div></div>
        <div style="margin-left:auto">${bricksHTML(e.vec)}</div></div>
      <h4 class="label">Rechenweg</h4>
      <ul class="steps"><li class="words">${words}</li>${s.map((x, i) => `<li>${i ? '<span class="eq">=</span>' : ''}${x}</li>`).join('')}</ul>
      <h4 class="label">Formel</h4><div class="formula">${e.formula}</div>
      <h4 class="label">Was bedeutet das?</h4><div>${e.info}</div>
      <h4 class="label">Im Alltag</h4><div>${e.example}</div>
      ${e.note ? `<div class="callout" style="margin-top:14px"><span>⚠︎</span><span>${e.note}</span></div>` : ''}
      ${same.length ? `<div class="callout" style="margin-top:8px"><span>↔︎</span><span>Gleiche Dimension wie: ${same.map(o => isDiscovered(o.id) ? `<b>${o.qty} (${o.symbol})</b>` : '<i>eine noch unentdeckte Größe</i>').join(', ')}</span></div>` : ''}
    </div>`;
  }
  function wordsFor(op, aName, bName, target){
    if (isBinary(op)) return `${target} = ${aName} ${op} ${bName}`;
    if (op === '1/x') return `${target} = 1 / ${aName}`;
    return `${target} = ${aName}${op}`;
  }
  function openCards(entries, c, headline){
    const body = entries.map(e => cardHTML(e, wordsFor(c.op, c.A.qtyName, c.B && c.B.qtyName, e.qty), c.steps)).join('');
    openSheet(`<div class="celebrate"><h2>${headline}</h2></div>${body}
      <div class="btnrow"><button class="btn primary" data-close>Weiter forschen</button></div>`);
  }
  function openBookEntry(id){
    const e = CAT_BY_ID[id], r = e.recipe, hasB = r.b !== undefined;
    const steps = routeSteps(r.op, refVec(r.a), hasB ? refVec(r.b) : undefined, refSymbol(r.a), hasB ? refSymbol(r.b) : null);
    openSheet(cardHTML(e, wordsFor(r.op, refName(r.a), hasB ? refName(r.b) : '', e.qty), steps), e.qty);
  }
  function openAdventureWin(c, st){
    const no = task.def.no, e = task.entry, hasNext = no < ADV_LEVELS.length;
    openSheet(`<div class="celebrate"><div class="bigstars">${starStr(st)}</div><h2>Level ${no} geschafft!</h2>
        <p class="lead" style="margin:2px 0 0">${task.moves} Schritt${task.moves === 1 ? '' : 'e'} · Bestwert ${task.def.par}${task.hinted ? ' · mit Tipp' : ''}</p></div>
      ${cardHTML(e, wordsFor(c.op, c.A.qtyName, c.B && c.B.qtyName, e.qty), c.steps)}
      <div class="btnrow">${hasNext ? '<button class="btn primary" data-act="next-level">Nächstes Level</button>' : ''}
        <button class="btn" data-act="retry">Nochmal</button><button class="btn" data-act="list">Übersicht</button></div>`);
  }
  function openLessonWin(c){
    const L = LESSONS[lessonIdx], next = lessonIdx + 1 < LESSONS.length;
    openSheet(`<div class="celebrate"><h2>Richtig!</h2></div>
      <div class="lesson"><div class="demo">${bricksHTML(c.res, true)}<span class="opbig">=</span><b style="font-size:1.8rem">${task.entry.symbol}</b></div>
      <p>${L.task.outro}</p></div>
      <div class="btnrow">${next ? '<button class="btn primary" data-act="next-lesson">Nächste Lektion</button>' : '<button class="btn primary" data-act="goto-adventure">Zum Abenteuer</button>'}
        <button class="btn" data-act="learn-list">Alle Lektionen</button></div>`);
  }
  function openBook(){
    const ul = unlockedStage(), n = state.labor.discovered.length;
    let html = `<div><b>${n}/${CATALOG.length}</b> entdeckt</div><div class="meter"><i style="width:${n / CATALOG.length * 100}%"></i></div>`;
    for (const S of STAGES){
      const lock = S.level > ul, entries = CATALOG.filter(e => e.level === S.level);
      html += `<div class="${lock ? 'locked' : ''}"><h4 class="label chapter" style="margin-top:20px">${S.title} · ${countStage(S.level)}/${entries.length}${lock ? ' · gesperrt' : ''}</h4>
        <div class="bookgrid">${entries.map(e => isDiscovered(e.id)
          ? `<button class="bentry" data-entry="${e.id}"><div class="s">${e.symbol}</div><div class="n">${e.qty}</div></button>`
          : `<div class="bentry unknown"><div class="s">???</div><div class="n">${lock ? 'gesperrt' : 'unentdeckt'}</div></div>`).join('')}</div></div>`;
    }
    html += `<div class="foot">Selbsttest: ${TEST.length - FAILS.length}/${TEST.length} Prüfungen bestanden${FAILS.length ? ' – Fehler: ' + FAILS.map(f => f.name).join(', ') : ' ✓'}</div>`;
    openSheet(html, 'Sammelbuch');
  }

  let lastFocus = null;
  function openSheet(inner, title){
    lastFocus = document.activeElement;
    sheet.innerHTML = (title ? `<div class="sheet-head"><h2>${title}</h2><button class="ghost" data-close aria-label="Schließen">✕</button></div>` : '') + inner;
    overlay.classList.add('open'); sheet.scrollTop = 0;
    const f = sheet.querySelector('.btn.primary, [data-close]'); if (f) f.focus({ preventScroll:true });
  }
  function closeSheet(){ overlay.classList.remove('open'); lastFocus?.focus?.({ preventScroll:true }); }

  /* ======================================================================
     EREIGNISSE
     ====================================================================== */
  function act(a){
    switch(a){
      case 'tip':  return mode === 'labor' ? laborTip() : adventureTip();
      case 'book': return openBook();
      case 'retry': closeSheet(); return startTask(task.kind, task.def);
      case 'list':  closeSheet(); task = null; view = 'list'; window.scrollTo(0, 0); return render();
      case 'next-level': closeSheet(); return startLevel(task.def.no + 1);
      case 'read': view = 'read'; pageIdx = LESSONS[lessonIdx].pages.length - 1; task = null; return render();
      case 'learn-list': closeSheet(); task = null; view = 'list'; window.scrollTo(0, 0); return render();
      case 'next-lesson': closeSheet(); return openLesson(lessonIdx + 1);
      case 'goto-adventure': closeSheet(); return setMode('adventure');
      case 'page-prev': pageIdx = Math.max(0, pageIdx - 1); window.scrollTo(0, 0); return render();
      case 'page-next': {
        const L = LESSONS[lessonIdx];
        if (pageIdx < L.pages.length - 1){ pageIdx++; window.scrollTo(0, 0); return render(); }
        if (L.task) return startTask('learn', L.task);
        finishLesson(lessonIdx); sfx.win();
        if (lessonIdx + 1 < LESSONS.length) return openLesson(lessonIdx + 1);
        view = 'list'; return render();
      }
    }
  }
  document.addEventListener('click', ev => {
    const a = ev.target.closest('[data-act]'); if (a && !a.disabled){ act(a.dataset.act); return; }
    const lv = ev.target.closest('[data-level]'); if (lv && !lv.disabled){ startLevel(+lv.dataset.level); return; }
    const ls = ev.target.closest('[data-lesson]'); if (ls){ openLesson(+ls.dataset.lesson); return; }
    const en = ev.target.closest('[data-entry]'); if (en){ openBookEntry(en.dataset.entry); return; }
    if (ev.target === overlay || ev.target.closest('[data-close]')) closeSheet();
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && overlay.classList.contains('open')) closeSheet(); });
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => combine(b.dataset.op)));
  Object.entries(slotEls).forEach(([s, el]) => el.addEventListener('click', () => { if (slots[s] !== null){ slots[s] = null; renderSlots(); } }));
  $('#btnSound').addEventListener('click', () => { state.sound = !state.sound; save(); render(); sfx.tap(); });
  $('#btnReset').addEventListener('click', () => {
    if (!confirm('Wirklich alles zurücksetzen? Labor, Abenteuer-Sterne und Lektionen gehen verloren.')) return;
    const snd = state.sound; state = freshState(); state.sound = snd; save();
    setMode('learn'); toast('Alles zurückgesetzt');
  });

  /* ---------- Drag & Drop (Pointer Events) + Tippen ---------- */
  // Maus: Ziehen startet sofort. Touch: kurz halten (≈ 0,2 s), dann ziehen –
  // so bleibt die Seite normal scrollbar. Kurzes Antippen = auf die Werkbank legen.
  let drag = null;
  const dropAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('[data-slot], #bench'); };
  drawer.addEventListener('pointerdown', ev => {
    const c = ev.target.closest('.chip');
    if (!c || ev.target.closest('[data-del]') || ev.button > 0) return;
    drag = { key: c.dataset.key, el: c, x0: ev.clientX, y0: ev.clientY, id: ev.pointerId, touch: ev.pointerType === 'touch',
             armed: ev.pointerType !== 'touch', started: false, ghost: null };
    if (drag.touch) drag.timer = setTimeout(() => { if (drag && !drag.started){ drag.armed = true; c.classList.add('armed'); navigator.vibrate?.(10); } }, 200);
  });
  window.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const d = Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0);
    if (!drag.started){
      if (!drag.armed){ if (d > 10) endDrag(); return; }
      if (d < 5) return;
      drag.started = true;
      const r = drag.el.getBoundingClientRect();
      drag.dx = ev.clientX - r.left; drag.dy = ev.clientY - r.top;
      drag.ghost = drag.el.cloneNode(true);
      drag.ghost.className = drag.el.className.replace(/\b(armed|sel|pop|flash)\b/g, '') + ' dragghost';
      document.body.appendChild(drag.ghost);
      drag.el.classList.add('dragging');
    }
    drag.ghost.style.transform = `translate(${ev.clientX - drag.dx}px, ${ev.clientY - drag.dy}px)`;
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));
    const t = dropAt(ev.clientX, ev.clientY);
    if (t && t.dataset.slot) t.classList.add('hover');
  });
  window.addEventListener('pointerup', ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const d = Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0);
    if (drag.started){ const t = dropAt(ev.clientX, ev.clientY); if (t) placeTile(drag.key, t.dataset.slot || null); }
    else if (d < 10) placeTile(drag.key, null);
    endDrag();
  });
  window.addEventListener('pointercancel', () => endDrag());
  document.addEventListener('touchmove', ev => { if (drag && drag.touch && drag.armed) ev.preventDefault(); }, { passive:false });
  drawer.addEventListener('contextmenu', ev => { if (ev.target.closest('.chip')) ev.preventDefault(); });
  function endDrag(){
    if (!drag) return;
    clearTimeout(drag.timer);
    drag.el.classList.remove('armed', 'dragging');
    drag.ghost?.remove();
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));
    drag = null;
  }
  drawer.addEventListener('keydown', ev => {
    const c = ev.target.closest('.chip');
    if (c && (ev.key === 'Enter' || ev.key === ' ')){ ev.preventDefault(); placeTile(c.dataset.key, null); }
  });
  drawer.addEventListener('click', ev => {
    const del = ev.target.closest('[data-del]'); if (!del) return;
    ev.stopPropagation();
    const key = del.closest('.chip').dataset.key, tiles = currentTiles();
    tiles.splice(tiles.indexOf(key), 1);
    if (slots.A === key) slots.A = null;
    if (slots.B === key) slots.B = null;
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
